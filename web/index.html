<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ref Pocket</title>
<meta name="description" content="Le jeu de cartes à collectionner de la culture internet française.">
<meta name="theme-color" content="#130f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ref Pocket">
<link rel="stylesheet" href="cartes.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout : appli mobile d'abord. En-tête collant (Kheys + boosters), une vue à la fois, barre d'onglets fixée en bas. Univers sombre assumé (salle d'arcade / écran de nuit), un seul thème. */
:root{
  --ink:#130f1c;          /* fond */
  --panel:#1e1830;        /* surfaces */
  --panel-2:#2a2242;      /* surfaces relevées */
  --line:#3a3157;         /* filets */
  --fg:#f4f0fb;           /* texte */
  --muted:#a69cbd;        /* texte secondaire */
  --accent:#46e0ff;       /* actions */
  --accent-ink:#06222b;
  --foil:#ffd23f;         /* boosters, Kheys */
  --good:#5be49b; --bad:#ff6b7d;
    /* raretés */
  --r-C:#8d84a3; --r-R:#58a8ff; --r-E:#cf7dff; --r-L:#ffd23f;
  --f-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:14px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 500px at 50% -200px,#2b1f4a 0%,transparent 70%),var(--ink);min-height:100vh;min-height:100dvh;
  /* Comme une vraie appli : pas de sélection de texte, pas de menu copier/coller, pas de zoom au double-tap */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{overscroll-behavior:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,video{-webkit-user-drag:none;user-drag:none}
/* Bandeau « installer l'appli » */
.instbar{position:fixed;z-index:45;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
  max-width:536px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.55);animation:instin .4s cubic-bezier(.2,1.3,.4,1)}
body.authed .instbar{top:calc(var(--hh,64px) + 8px)}
@keyframes instin{from{opacity:0;transform:translateY(-20px)}}
.instbar .shr{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin:0 2px}
.instbar .ib-ic{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#1a1030;background:var(--foil)}
.instbar .ib-t{flex:1;min-width:0;display:grid;gap:1px;font-size:13px}.instbar .ib-t b{font-size:14px}
.instbar .ib-x{background:none;border:0;color:var(--muted);font-size:18px;padding:6px;flex:none}

*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:rgba(19,15,28,.92);background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--f-display);font-size:22px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.logo b{background:linear-gradient(90deg,#ff6fbf 0%,#a98bff 55%,#46e0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
.wallet{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:430px){header.top .wrap{gap:8px}.logo{font-size:19px}.wallet{gap:6px!important;flex-wrap:nowrap!important}.pill{padding:4px 8px!important;font-size:12px!important;gap:4px!important}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .k{color:var(--foil)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}

main{padding-block:18px calc(var(--nh,80px) + 18px)}
body:not(.authed) main{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.3px;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,6vw,38px);line-height:1.05}
h2{font-size:20px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);letter-spacing:.01em}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.foil{background:var(--foil);color:#2a2000}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(30,24,48,.96);background:color-mix(in srgb,var(--panel) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg);background:var(--panel-2)}
nav.tabs button .badge{position:absolute;transform:translate(14px,-4px);background:var(--foil);color:#2a2000;font-size:10px;border-radius:999px;padding:0 5px;font-family:var(--f-mono)}
nav.tabs button{position:relative}

/* Grilles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.grid > button{background:none;border:0;padding:0;border-radius:12px;text-align:left}
.grid{grid-template-columns:repeat(3,1fr)}

/* Vue boosters */
.hero{display:grid;gap:22px;grid-template-columns:1fr;align-items:center;padding-block:8px 20px;text-align:center;justify-items:center}
.hero .row{justify-content:center}.hero .sub{margin-inline:auto}
/* Page booster : tout tient dans l'écran, sans défilement */
html.noscroll,html.noscroll body{overflow:hidden;overscroll-behavior:none}
html.noscroll main{height:calc(100dvh - var(--hh,64px) - var(--nh,80px));padding-block:10px 12px;overflow:hidden}
html.noscroll .hero{height:100%;grid-template-rows:minmax(0,1fr) auto;gap:clamp(8px,2dvh,18px);padding:0;align-items:stretch}
html.noscroll .hero .pack{height:100%;width:auto;max-height:400px;max-width:72vw;min-height:0;align-self:center}
html.noscroll .hero>div{gap:clamp(6px,1.4dvh,14px)!important}
html.noscroll .hero h1{font-size:clamp(22px,4dvh,34px)}
@media (max-height:600px){html.noscroll .hero .sub{display:none}}
.pack{position:relative;width:min(220px,58vw);animation:bob 3.2s ease-in-out infinite;aspect-ratio:5/8;margin:0 auto;border-radius:18px;border:0;padding:0;
  background:linear-gradient(135deg,#ffe46b 0%,#ffb13b 25%,#ff6fbf 50%,#8f6bff 75%,#46e0ff 100%);box-shadow:0 20px 50px -18px rgba(255,180,60,.55),inset 0 0 0 3px rgba(255,255,255,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#1a1030;overflow:hidden;transition:transform .2s}
.pack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.0) 0 18px,rgba(255,255,255,.18) 18px 20px);mix-blend-mode:overlay}
.pack::after{content:"";position:absolute;left:0;right:0;top:9%;height:2px;background:repeating-linear-gradient(90deg,rgba(26,16,48,.5) 0 6px,transparent 6px 10px)}
.pack .pt{font-family:var(--f-display);font-size:clamp(28px,8vw,38px);line-height:.9;text-align:center;transform:rotate(-6deg)}
.pack .ps{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:#1a1030;color:var(--foil);padding:4px 10px;border-radius:99px}
.pack:not(:disabled):hover{transform:translateY(-4px) rotate(-1deg)}
.pack:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
.pack.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted)}
.rates{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rates th,.rates td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.rates th:first-child,.rates td:first-child{text-align:left}
.rates th{color:var(--muted);font-weight:700;font-size:12px}
.tablewrap{overflow-x:auto}
section.block{margin-top:26px;display:grid;gap:12px}

/* Ouverture de booster : scène plein écran, pensée en portrait */
.ov{position:fixed;inset:0;z-index:50;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
  background:radial-gradient(ellipse 90% 60% at 50% 40%,#2c1e52 0%,#120c22 55%,#07050d 100%);
  --cw:min(74vw,330px,calc(58vh * .716));}
@supports (height:1dvh){.ov{--cw:min(74vw,330px,calc(58dvh * .716))}}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.ov .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.ov .flash.go{animation:flash .5s ease-out}
.ov .flash.gold{background:radial-gradient(circle at 50% 45%,#fff6c8,#ffd23f 40%,transparent 75%)}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.ov-top{position:absolute;z-index:7;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.ov-top .btn{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:rgba(30,24,48,.6)}
.ov .counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.1em}
.stage{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.stage.quake{animation:quake .55s}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(5px,4px)}75%{transform:translate(-3px,2px)}}
.ov .hint{font-weight:700;font-size:14px;color:var(--muted);text-align:center;min-height:1.4em;letter-spacing:.02em;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* Paquet */
.opack{position:relative;width:calc(var(--cw) * .92);aspect-ratio:63/98;cursor:grab;touch-action:none;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.opack:active{cursor:grabbing}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
.opack .body,.opack .strip{position:absolute;left:0;right:0;background:linear-gradient(135deg,#ffe46b 0%,#ffb13b 22%,#ff6fbf 48%,#8f6bff 74%,#46e0ff 100%);background-size:100% 100%;overflow:hidden}
.opack .body{top:12%;bottom:0;border-radius:4px 4px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#1a1030;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.opack .strip{top:0;height:12.6%;border-radius:18px 18px 3px 3px;z-index:2;transform-origin:0% 100%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.2em;color:rgba(26,16,48,.75)}
.opack .body::before,.opack .strip::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 18px,rgba(255,255,255,.2) 18px 20px);mix-blend-mode:overlay}
.opack .body::after{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.opack .pt{position:relative;font-family:var(--f-display);font-size:calc(var(--cw) * .17);line-height:.88;text-align:center;transform:rotate(-7deg);text-shadow:0 3px 0 rgba(255,255,255,.4)}
.opack .ps{position:relative;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:#1a1030;color:var(--foil);padding:5px 12px;border-radius:99px}
.opack .serie{position:absolute;bottom:14px;font-family:var(--f-mono);font-size:11px;font-weight:600;opacity:.7}
.opack .tear{position:absolute;z-index:3;top:12.3%;left:0;height:3px;width:var(--tp,0%);background:#fff;border-radius:3px;box-shadow:0 0 10px #fff,0 0 26px var(--foil),0 0 50px var(--foil)}
.opack .light{position:absolute;z-index:1;left:-30%;right:-30%;top:-80%;height:110%;background:radial-gradient(ellipse at 50% 100%,#fff 0%,var(--lc,#ffd23f) 30%,transparent 70%);opacity:0;pointer-events:none}
.opack.torn{animation:none}
.opack.torn .strip{animation:stripoff .7s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes stripoff{to{transform:translate(-40%,-220%) rotate(-38deg);opacity:0}}
.opack.torn .light{animation:light 1s ease-out forwards}
@keyframes light{0%{opacity:0}30%{opacity:1}100%{opacity:.7}}
.opack.torn .body{animation:packshake .45s}
@keyframes packshake{0%,100%{transform:none}25%{transform:rotate(-2deg) scale(1.02)}50%{transform:rotate(2deg) scale(1.03)}75%{transform:rotate(-1deg)}}
.opack.gone{transition:transform .55s cubic-bezier(.5,0,.75,0),opacity .55s;transform:translateY(75vh) rotate(8deg);opacity:0}

/* Pile de cartes */
.stack{position:relative;width:var(--cw);aspect-ratio:63/88;flex:none}
.rays{position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;translate:-50% -50%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;
  background:repeating-conic-gradient(from 0deg,var(--rc,#fff) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 22s linear infinite}
.rays.on{opacity:.28}.rays.big{opacity:.6;animation-duration:9s}
@keyframes spin{to{rotate:360deg}}
.halo{position:absolute;inset:-12%;z-index:0;border-radius:50%;background:radial-gradient(circle,var(--rc,transparent) 0%,transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none}
.halo.on{opacity:.55}
/* Lueur « mystère » épique/légendaire : alterne or et violet pour ne pas trahir la rareté */
/* (fondu d'opacité uniquement : fluide même sur les petits téléphones) */
.halo.myst{background:radial-gradient(circle,#ffd23f 0%,transparent 65%)}
.halo.myst::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#cf7dff 0%,transparent 65%);animation:mystfade 1.5s ease-in-out infinite;will-change:opacity}
@keyframes mystfade{0%,100%{opacity:0}50%{opacity:1}}
.sc.await.myst .cardback{animation:auram 1.5s ease-in-out infinite}
@keyframes auram{0%,100%{box-shadow:0 0 18px 2px #ffd23f,0 18px 40px -10px rgba(0,0,0,.7)}50%{box-shadow:0 0 46px 10px #cf7dff,0 18px 40px -10px rgba(0,0,0,.7)}}
.wo.mys{--wc:#e9a6e8}.wo.mys .beam.l{--wc:#ffd23f}.wo.mys .beam.r{--wc:#cf7dff}
.sc{position:absolute;inset:0;z-index:1;perspective:1400px;transition:transform .5s cubic-bezier(.2,.9,.25,1.12),filter .5s;will-change:transform;touch-action:none;cursor:pointer}
.sc.rC{--rc:var(--r-C)}.sc.rR{--rc:var(--r-R)}.sc.rE{--rc:var(--r-E)}.sc.rL{--rc:var(--r-L)}
.sc .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.35,.45,1)}
.sc .flip>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sc .front{transform:rotateY(180deg)}
.sc.open .flip{transform:rotateY(180deg)}
.sc .cardback{box-shadow:0 18px 40px -10px rgba(0,0,0,.7)}
.sc.await .cardback{animation:aura 1.3s ease-in-out infinite}
@keyframes aura{0%,100%{box-shadow:0 0 18px 2px var(--rc),0 18px 40px -10px rgba(0,0,0,.7)}50%{box-shadow:0 0 46px 10px var(--rc),0 18px 40px -10px rgba(0,0,0,.7)}}
.sc.charge .flip{animation:charge 1s ease-in forwards}
@keyframes charge{0%{transform:none}20%{transform:rotate(-1deg) scale(1.01)}40%{transform:rotate(1.6deg) scale(1.03)}60%{transform:rotate(-2.4deg) scale(1.05)}80%{transform:rotate(3deg) scale(1.08)}100%{transform:rotate(0) scale(1.1)}}
.sc.open .card{box-shadow:0 22px 50px -12px rgba(0,0,0,.75)}
.sc.open.rL .card{box-shadow:0 0 40px 4px var(--r-L),0 22px 50px -12px rgba(0,0,0,.75)}
.sc.open.rE .card{box-shadow:0 0 30px 2px var(--r-E),0 22px 50px -12px rgba(0,0,0,.75)}
.sc.drag{transition:none}
.sc .newtag{position:absolute;z-index:6;top:-12px;left:50%;translate:-50% 0;background:var(--good);color:#06240f;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;letter-spacing:.06em;opacity:0;scale:.4;transition:opacity .25s .55s,scale .35s cubic-bezier(.3,1.6,.5,1) .55s;white-space:nowrap}
.sc.open .newtag{opacity:1;scale:1}
.cardinfo{display:grid;justify-items:center;gap:4px;min-height:66px;text-align:center}
.cardinfo .rname{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:.04em;opacity:0;transform:translateY(8px) scale(.9);transition:all .35s cubic-bezier(.3,1.5,.5,1)}
.cardinfo .cn{font-weight:700;color:var(--muted);opacity:0;transition:opacity .3s .1s}
.cardinfo.on .rname{opacity:1;transform:none}.cardinfo.on .cn{opacity:1}

/* Récap */
.sum{width:min(100%,440px);display:grid;gap:18px;justify-items:center;text-align:center}
.sumgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.sumgrid>.mini{position:relative;width:calc((100% - 20px) / 3);animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:var(--d,0s)}
.sumgrid .mini .newtag{position:absolute;z-index:6;top:-8px;left:50%;translate:-50% 0;background:var(--good);color:#06240f;font-weight:800;font-size:10px;padding:2px 7px;border-radius:99px}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(20px)}}
.sum .row{justify-content:center}

/* Walkout façon FIFA : projecteurs, indices, puis la carte qui tombe */
.wo{position:absolute;inset:0;z-index:6;overflow:hidden;cursor:pointer;opacity:0;animation:woin .45s forwards;
  background:radial-gradient(ellipse 120% 70% at 50% 105%,color-mix(in srgb,var(--wc) 32%,#05030a) 0%,#05030a 62%)}
.wo.out{animation:woout .4s forwards}
@keyframes woin{to{opacity:1}}@keyframes woout{from{opacity:1}to{opacity:0}}
.wo .beam{position:absolute;bottom:-8%;width:46vmax;height:150vh;transform-origin:50% 100%;pointer-events:none;opacity:.55;will-change:transform;
  -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 47%,#000 53%,transparent 70%);mask-image:linear-gradient(90deg,transparent 30%,#000 47%,#000 53%,transparent 70%);
  background:linear-gradient(to top,color-mix(in srgb,var(--wc) 70%,#fff) 0%,color-mix(in srgb,var(--wc) 40%,transparent) 35%,transparent 85%);clip-path:polygon(47% 100%,53% 100%,100% 0,0 0)}
.wo .beam.l{left:-18vmax;animation:swl 2.6s ease-in-out infinite alternate}
.wo .beam.r{right:-18vmax;animation:swr 2.9s ease-in-out infinite alternate}
.wo .beam.c{left:50%;margin-left:-23vmax;opacity:.25;animation:pulseb 1.4s ease-in-out infinite}
@keyframes swl{from{transform:rotate(28deg)}to{transform:rotate(-6deg)}}
@keyframes swr{from{transform:rotate(-28deg)}to{transform:rotate(6deg)}}
@keyframes pulseb{50%{opacity:.5}}
.wo .haze{position:absolute;inset:-25%;pointer-events:none;animation:drift 7s ease-in-out infinite alternate;
  background:radial-gradient(ellipse at 30% 70%,rgba(255,255,255,.08),transparent 45%),radial-gradient(ellipse at 72% 58%,rgba(255,255,255,.07),transparent 45%),radial-gradient(ellipse at 50% 90%,color-mix(in srgb,var(--wc) 30%,transparent),transparent 50%)}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
.wo .floor{position:absolute;left:50%;bottom:16%;width:120vw;height:12vh;translate:-50% 0;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--wc) 55%,transparent),transparent 70%);animation:pulseb 1.4s ease-in-out infinite}
.wo .clue{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:0 24px}
.wo .clue .lab{font-weight:800;letter-spacing:.4em;font-size:13px;color:rgba(255,255,255,.72);text-transform:uppercase}
.wo .clue .big{font-family:var(--f-display);font-size:clamp(40px,13vw,76px);line-height:1;color:#fff;text-shadow:0 0 24px var(--cc),0 0 60px var(--cc);text-wrap:balance}
.wo .clue .sw{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--cc) 35%,color-mix(in srgb,var(--cc) 50%,#000) 100%);box-shadow:0 0 50px var(--cc)}
.wo .clue .pips{font-size:44px;letter-spacing:.2em;color:var(--cc);text-shadow:0 0 24px var(--cc)}
.wo .clue>*{will-change:transform,opacity}
.wo .clue.show>*{animation:cluein .65s cubic-bezier(.2,1.4,.4,1) backwards}
.wo .clue.show>*:nth-child(2){animation-delay:.08s}.wo .clue.show>*:nth-child(3){animation-delay:.16s}
.wo .clue.hide>*{animation:clueout .3s forwards}
@keyframes cluein{from{opacity:0;transform:scale(1.6)}}
@keyframes clueout{to{opacity:0;transform:translateY(-34px) scale(.9)}}
.wo .wo-skip{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:rgba(255,255,255,.45);font-size:13px;font-weight:700}
.wo .wo-dots{position:absolute;left:0;right:0;top:calc(70px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:8px}
.wo .wo-dots i{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.wo .wo-dots i.on{background:var(--wc);box-shadow:0 0 10px var(--wc)}
.stage.dimmed{opacity:0;transition:opacity .25s}
.stage{transition:opacity .3s}
.stack.slam{animation:slam .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes slam{0%{transform:translateY(-38vh) scale(2.4);opacity:0;filter:blur(10px)}55%{opacity:1;filter:none}100%{transform:none;opacity:1}}
.ring{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:1;border:5px solid var(--rc,#fff);border-radius:50%;translate:-50% -50%;pointer-events:none;z-index:0;animation:ring .8s ease-out forwards;box-shadow:0 0 30px var(--rc,#fff)}
.ring.r2{animation-delay:.12s;border-width:2px;opacity:0}
@keyframes ring{0%{scale:.25;opacity:1}100%{scale:2.8;opacity:0}}
.cardinfo .ovrline{font-family:var(--f-mono);font-size:13px;letter-spacing:.2em;color:var(--muted);opacity:0;transition:opacity .3s .15s}
.cardinfo.on .ovrline{opacity:1}

/* Modale */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog::backdrop{background:rgba(9,6,16,.8)}
.dlg{display:grid;gap:16px;padding:18px}
.dlg .top{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media (max-width:440px){.dlg .top{grid-template-columns:1fr}.dlg .top .card{max-width:200px;margin:0 auto}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.fxbox{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px}
.fxbox b{color:var(--foil)}
.flavor{font-style:italic;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
input[type=number],select{background:var(--ink);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-family:var(--f-mono);width:100%}
.note{font-size:13px;color:var(--muted)}

/* Marché */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.offer{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.offer .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.price{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--foil)}
.price.cheap{color:var(--good)}

/* Duel */
.deckslots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:100%;min-width:0}
.deckslots>*{min-width:0;width:100%}
@media (max-width:560px){.deckslots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.deckslots .empty{aspect-ratio:63/88;height:auto;box-sizing:border-box;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--line);font-family:var(--f-display);font-size:22px}
.grid > button.picked .card{outline:3px solid var(--accent);outline-offset:3px}
.grid > button.blocked{opacity:.35}
.deckpick{display:grid;gap:14px;margin-top:10px}
.fxcap{display:block;margin-top:6px;font-size:10.5px;line-height:1.3;color:var(--muted);text-align:left;font-weight:500}
.fxcap b{color:var(--fg);font-weight:800}
.fxcap .hl,.deckfx .hl{display:block;font-style:normal;font-weight:800;color:#ffe86b}
.deckfx .hl{display:inline}
.deckfx{display:grid;gap:6px;font-size:12.5px;line-height:1.35;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.deckfx b{color:var(--fg)}.deckfx .fxn2{color:var(--accent);font-weight:800}
.deckpick .rhead{font-size:15px}
.grid>button.holotile{position:relative}
.cstack{position:relative;display:block;padding:4% 7% 0 0}
.cstack .cs-back{position:absolute;inset:0 0 4% 7%;transform:rotate(6deg);transform-origin:30% 100%;z-index:0;filter:brightness(.95)}
.cstack .cs-back .card{width:100%}
.cstack .cs-front{position:relative;z-index:1;display:block;filter:drop-shadow(-4px 6px 8px rgba(0,0,0,.55))}
.cstack .cs-h{position:absolute;right:-2px;top:-8px;z-index:3;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;color:#1a1030;background:linear-gradient(90deg,#ff9bd2,#c3a8ff,#8ff0ff)}
.cstack.solo{padding:0}
.grid>button .htag{position:absolute;left:50%;bottom:-7px;translate:-50% 0;z-index:4;white-space:nowrap;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;color:#1a1030;
  background:linear-gradient(90deg,#ff9bd2,#c3a8ff,#8ff0ff);box-shadow:0 3px 10px rgba(0,0,0,.5)}
.arena{display:grid;gap:12px}
.side{display:grid;gap:8px}
.sidehead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700;gap:8px;flex-wrap:wrap}
.reserve{display:flex;gap:4px}
.reserve i{width:12px;height:16px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.reserve i.on{background:#3d2a77;border-color:#5a46a0}
.lane{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unit{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:6px;text-align:left;min-width:0;transition:transform .15s,border-color .15s}
.unit{--tc:var(--muted);background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 30%,var(--panel)) 0%,var(--panel) 60%)}
.unit .uh{display:flex;gap:8px;align-items:center;min-width:0}
.unit .ua{font-size:28px;line-height:1}
.unit .uimg{width:40px;height:30px;object-fit:cover;border-radius:6px;flex:none}
.unit .un{font-weight:800;font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.unit .ut{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tc);filter:brightness(1.25)}
.hp{height:8px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}
.hp i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.hp.low i{background:var(--bad)}
.ustats{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ustats span i{font-style:normal;color:var(--muted);margin-right:3px}
.ubadges{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.ubadges span{font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.ubadges .stun{color:var(--foil)}
.unit.sel{border-color:var(--accent);transform:translateY(-4px)}
.unit.target{border-color:var(--bad);cursor:crosshair}
.unit.dim{opacity:.45}
.unit.emptyslot{background:none;border-style:dashed;min-height:120px;display:grid;place-items:center;color:var(--line);font-size:12px}
.unit .pred{position:absolute;top:-10px;right:-6px;background:var(--bad);color:#2a0008;font-family:var(--f-mono);font-weight:600;font-size:12px;border-radius:99px;padding:1px 7px}
.unit .pred.adv{background:var(--foil);color:#2a2000}
.unit.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.unit .float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-size:26px;color:var(--bad);text-shadow:0 2px 0 #000;animation:floatup .9s forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.turnbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.turnbar b{font-family:var(--f-display);font-weight:400;font-size:16px}
.log{font-size:13px;color:var(--muted);display:grid;gap:2px;min-height:4.5em}
.log div:first-child{color:var(--fg)}
.result{text-align:center;display:grid;gap:10px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.result h2{font-size:30px}

/* Toasts */
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nh,80px) + 12px);display:grid;gap:8px;width:min(420px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--fg);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.empty-state{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
.progress{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--r-E))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Version en ligne : connexion, échanges ===== */
nav.tabs .wrap{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11px}
body:not(.authed) nav.tabs,body:not(.authed) header.top{display:none}
body.working{cursor:progress}
body.working .btn{pointer-events:none}
input[type=email],input[type=password],input[type=text],input[type=search]{background:var(--ink);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;font:inherit;width:100%}
.auth{display:grid;gap:16px;justify-items:center;text-align:center;padding-block:4vh 8px}
.authlogo{font-family:var(--f-display);font-size:34px;line-height:1}.authlogo b{background:linear-gradient(90deg,#ff6fbf 0%,#a98bff 55%,#46e0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
.authpack{width:120px;aspect-ratio:63/98;border-radius:12px;display:grid;place-items:center;transform:rotate(-6deg);animation:bob 3.2s ease-in-out infinite;
  background:linear-gradient(135deg,#ffe46b 0%,#ffb13b 22%,#ff6fbf 48%,#8f6bff 74%,#46e0ff 100%);box-shadow:0 20px 40px -14px rgba(255,180,60,.5)}
.authpack span{font-family:var(--f-display);font-size:22px;line-height:.9;color:#1a1030}
.authform{display:grid;gap:12px;width:min(100%,360px);text-align:left}
.authform .btn{width:100%}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:6px;text-decoration:underline;text-underline-offset:3px}
.trade{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.trade.incoming{border-color:var(--foil)}
.tsides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tside{display:grid;gap:6px;align-content:start;min-width:0}
.tcards{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcards>div{width:64px}
.tk{font-family:var(--f-mono);font-weight:600;color:var(--foil);background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:13px}
.tstatus{font-size:12px;font-weight:700;color:var(--muted)}
.tstatus.s-accepted{color:var(--good)}.tstatus.s-refused,.tstatus.s-failed{color:var(--bad)}.tstatus.s-open{color:var(--foil)}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:46vh;overflow-y:auto;padding:4px}
.pickgrid>button{background:none;border:0;padding:0;border-radius:8px}
.pickgrid>button.picked .card{outline:3px solid var(--accent);outline-offset:2px}
.pickgrid>button:not(.picked){opacity:.8}
.players{display:grid;gap:8px}
.player{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.player:hover{border-color:var(--accent)}
.dlg{overflow-y:auto;max-height:calc(100vh - 40px)}
.cardview{justify-items:center;text-align:center;gap:12px}
/* Vue détaillée d'une carte */
.cview{gap:14px;overflow-x:hidden}
.cv-stage{position:relative;display:grid;place-items:center;padding:18px 0 10px;perspective:900px;overflow:hidden;border-radius:14px;
  background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--rc,var(--panel-2)) 22%,transparent),transparent 70%)}
.cv-stage.rC{--rc:var(--r-C)}.cv-stage.rR{--rc:var(--r-R)}.cv-stage.rE{--rc:var(--r-E)}.cv-stage.rL{--rc:var(--r-L)}
.cv-stage .rays{opacity:.22}.cv-stage .rays.big{opacity:.4}
.cv-card{position:relative;z-index:1;width:min(270px,68vw);transform-style:preserve-3d;transition:transform .15s ease-out;animation:cvIn .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes cvIn{from{opacity:0;transform:scale(.55) rotateY(-35deg) translateY(30px)}}
.cv-shine{position:absolute;inset:0;border-radius:2.8cqw;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:opacity .2s;
  background:radial-gradient(circle at var(--sx,50%) var(--sy,30%),rgba(255,255,255,.55),transparent 45%)}
.cv-stage:hover .cv-shine,.cv-stage:active .cv-shine,.cv-stage.tilting .cv-shine{opacity:1}
.cv-glow{position:absolute;z-index:0;width:min(300px,76vw);aspect-ratio:63/88;border-radius:16px;background:var(--rc);filter:blur(28px);opacity:.45;animation:cvGlow 2.4s ease-in-out infinite}
.cv-stage.isholo .cv-glow{background:linear-gradient(120deg,#ff7ad1,#6ef0ff,#ffe86b,#a98bff);animation:cvGlow 2.4s ease-in-out infinite,cvHue 4s linear infinite}
@keyframes cvGlow{50%{opacity:.75;transform:scale(1.05)}}
@keyframes cvHue{to{filter:blur(28px) hue-rotate(360deg)}}
.cv-stage.rL .cv-card{animation:cvIn .7s cubic-bezier(.2,1.3,.4,1),cvFloat 3.2s ease-in-out .7s infinite}
@keyframes cvFloat{50%{translate:0 -8px}}
.cv-info{display:grid;gap:8px;text-align:center;justify-items:center}
.cv-info h2{font-size:24px}
.cv-info .flavor{max-width:38ch;margin:0}
.cv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px}
.cv-stats div{display:grid;background:var(--panel-2);border-radius:10px;padding:8px 4px}
.cv-stats em{font-style:normal;font-size:.62em;color:var(--foil);margin-left:3px;vertical-align:super}

/* =========== Arène de duel =========== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.arena2{position:relative;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:6px;min-height:calc(100dvh - 150px - env(safe-area-inset-bottom,0px));
  margin:-8px -16px 0;padding:10px 12px 12px;overflow:hidden;isolation:isolate;border-radius:0 0 22px 22px;
  background:radial-gradient(ellipse 90% 40% at 50% 0%,rgba(255,93,115,.22),transparent 70%),radial-gradient(ellipse 90% 40% at 50% 100%,rgba(70,224,255,.2),transparent 70%),
    radial-gradient(ellipse 60% 50% at 50% 50%,#2a1d4f 0%,#130f1c 75%)}
.arena2::before,.arena2::after{content:"";position:absolute;top:-10%;width:60%;height:120%;z-index:-1;pointer-events:none;mix-blend-mode:screen;opacity:.35;filter:blur(18px);
  background:linear-gradient(to bottom,rgba(255,255,255,.5),transparent 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
.arena2::before{left:-18%;transform:rotate(-14deg);animation:spotl 7s ease-in-out infinite alternate}
.arena2::after{right:-18%;transform:rotate(14deg);animation:spotr 8s ease-in-out infinite alternate}
@keyframes spotl{to{transform:rotate(-4deg)}}@keyframes spotr{to{transform:rotate(4deg)}}
.a-fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.a-floor{position:absolute;left:-30%;right:-30%;top:50%;height:60%;z-index:-1;pointer-events:none;opacity:.35;transform:perspective(380px) rotateX(62deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,rgba(169,139,255,.35) 0 1px,transparent 1px 44px),repeating-linear-gradient(0deg,rgba(169,139,255,.35) 0 1px,transparent 1px 44px);
  -webkit-mask:linear-gradient(to bottom,#000,transparent 80%);mask:linear-gradient(to bottom,#000,transparent 80%)}
.a-head{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
/* =========================================================
   CONNEXION À SUPABASE (réglages dans config.js)
   ========================================================= */
const CFG = window.REF_CONFIG || {};
const configured = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && !/TON-PROJET|COLLE_ICI/.test(CFG.supabaseUrl + CFG.supabaseAnonKey));
const sb = configured && window.supabase ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, CFG.clientOptions || {}) : null;

/* =========================================================
   RÉFÉRENTIEL (le catalogue est chargé depuis la base)
   ========================================================= */
let TYPES = {}, CARDS = [], BYID = {}, BYR = {}, MATCH = {};
// Règles (doivent rester alignées avec supabase/schema.sql)
const REFILL_MS = 3600*1000, MAX_STOCK = 2, BOOSTER_PRICE = 100, PITY = 60;
const DUEL_WIN = 30, DUEL_LOSS = 10, DUEL_DAILY = 10, DECK_SIZE = 6, DECK_MAX = {L:1,E:2};
const BOTS = ["LeKheyDu38","Ratio_King","Askip_Lucas","MissAllôQuoi","JusteLeblanc"];

async function loadCatalogue(){
  const [t,m,c] = await Promise.all([
    sb.from("types").select("*").order("sort"),
    sb.from("type_matchups").select("*"),
    sb.from("cards").select("*").order("n"),
  ]);
  for(const r of [t,m,c]) if(r.error) throw r.error;
  TYPES = {};
  for(const x of t.data) TYPES[x.id] = {name:x.name, abbr:x.abbr, color:x.color, lvl:x.lvl, bat:[]};
  MATCH = {};
  for(const x of m.data){ MATCH[x.attacker+">"+x.defender] = Number(x.mult); if(Number(x.mult)>1 && TYPES[x.attacker]) TYPES[x.attacker].bat.push(x.defender); }
  CARDS = c.data.map(cardFromRow);
  for(const cd of CARDS) if(!TYPES[cd.type]) TYPES[cd.type] = {name:cd.type, abbr:cd.type.slice(0,4).toUpperCase(), color:"#8d84a3", bat:[]};
  numberCards(CARDS);
  BYID = Object.fromEntries(CARDS.map(c=>[c.id,c]));
  BYR = Object.fromEntries(RORDER.map(r=>[r,CARDS.filter(c=>c.r===r&&c.active)]));
  if(!CARDS.length) throw new Error("Le catalogue est vide : lance supabase/catalogue.sql dans Supabase.");
}
function albumSize(){return CARDS.filter(c=>c.active).length;}

/* =========================================================
   ÉTAT : le serveur fait foi, le navigateur garde juste les préférences
   ========================================================= */
let L; try{ L = JSON.parse(localStorage.getItem("refmaster-local")||"null"); }catch(e){ L = null; }
L = Object.assign({mute:false, deck:[], saleSeen:null}, L||{});
function saveL(){ try{ localStorage.setItem("refmaster-local", JSON.stringify(L)); }catch(e){} }
const S = {user:null, me:null, insts:[], players:{}, listings:[], trades:[], friends:[], duels:[], levels:{}, albums:{}};

async function sync(){
  if(!S.user) return;
  const me = await sb.rpc("my_profile");
  if(me.error) throw me.error;
  S.me = me.data && me.data.id ? me.data : null;
  if(!S.me) return;
  const [ins,pl,ls,tr,fr,du,lv,al] = await Promise.all([
    sb.from("card_instances").select("id,card_id,holo,lock,obtained_at").eq("owner",S.me.id).limit(5000),
    sb.from("profiles").select("*").order("pseudo"),
    sb.from("listings").select("id,price,seller,created_at,instance_id,inst:card_instances(id,card_id,holo)").eq("status","open").order("created_at",{ascending:false}).limit(300),
    sb.from("trades").select("*,items:trade_items(side,instance_id,inst:card_instances(id,card_id,holo,owner))").order("created_at",{ascending:false}).limit(40),
    sb.from("friendships").select("*"),
    sb.from("duels").select("id,player_a,player_b,mode,status,created_at,updated_at").in("status",["waiting","invited","active"]),
    sb.from("card_levels").select("card_id,level").eq("owner",S.me.id),
    sb.from("album_claims").select("album,reward").eq("owner",S.me.id),
  ]);
  for(const r of [ins,pl,ls,tr,fr,du]) if(r.error) throw r.error;
  // Niveaux et albums : si le script SQL n'a pas encore été relancé, on fait comme s'il n'y en avait pas
  S.levels = lv.error?{}:Object.fromEntries(lv.data.map(x=>[x.card_id,x.level]));
  S.albums = al.error?{}:Object.fromEntries(al.data.map(x=>[x.album,x.reward]));
  S.friends = fr.data; S.duels = du.data;
  loadLive().catch(()=>{});
  S.insts = ins.data; S.players = Object.fromEntries(pl.data.map(p=>[p.id,p]));
  // Des cartes ont été ajoutées depuis l'ouverture de l'appli : on recharge le catalogue
  if(S.insts.some(i=>!BYID[i.card_id])) await loadCatalogue().catch(()=>{});
  S.listings = ls.data; S.trades = tr.data;
  reconcileDuels();
  await checkSales();
}
async function checkSales(){
  const now = new Date().toISOString();
  if(!L.saleSeen){ L.saleSeen = now; saveL(); return; }
  const r = await sb.from("listings").select("id,price,buyer,closed_at,inst:card_instances(card_id)").eq("seller",S.me.id).eq("status","sold").gt("closed_at",L.saleSeen).order("closed_at");
  if(r.error) return;
  for(const s of r.data){
    const c = BYID[s.inst?.card_id];
    toast(`Vendu ! ${S.players[s.buyer]?.pseudo||"Un joueur"} a acheté « ${c?c.name:"une carte"} » : +${fmt(s.price)} K`);
  }
  if(r.data.length){ L.saleSeen = r.data[r.data.length-1].closed_at; saveL(); }
}

/* =========================================================
   OUTILS
   ========================================================= */
const $ = s=>document.querySelector(s);
const rnd = a=>a[Math.floor(Math.random()*a.length)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const fmt = n=>Math.round(n).toLocaleString("fr-FR");
function mineOf(id){return S.insts.filter(i=>i.card_id===id);}
function own(id){const a=mineOf(id);return {n:a.filter(i=>!i.holo).length,h:a.filter(i=>i.holo).length};}
function count(id){return mineOf(id).length;}
function lvl(id){return S.levels[id]||0;}
function myCard(id){return boosted(BYID[id],lvl(id));}
// Doubles utilisables pour une fusion : ni holo, ni en vente / échange, et on garde toujours un exemplaire
function fuelOf(id){const a=mineOf(id);return Math.min(a.filter(i=>!i.holo&&!i.lock).length,a.length-1);}
function canUpgrade(id){const l=lvl(id);return l<LVL_MAX&&fuelOf(id)>=lvlCost(l+1);}
// Albums : un par type + l'album complet ("*")
function albumList(){
  const act=CARDS.filter(c=>c.active);
  const mk=(key,name,color,cards)=>{const got=cards.filter(c=>count(c.id)>0).length;
    return {key,name,color,total:cards.length,got,done:got===cards.length,claimed:key in S.albums,
      reward:key==="*"?3000:Math.min(1500,Math.max(150,15*cards.length))};};
  const list=Object.entries(TYPES).map(([k,t])=>mk(k,t.name,t.color,act.filter(c=>c.type===k))).filter(a=>a.total>0);
  return [mk("*","Album complet","#ffd23f",act),...list];
}
function claimableAlbums(){return albumList().filter(a=>a.done&&!a.claimed).length;}
function freeInst(id,holo){return mineOf(id).find(i=>!i.lock&&!!i.holo===!!holo);}
function worth(c,holo){return RARITIES[c.r].value*(holo?3:1);}
function discardValue(c,holo){return RARITIES[c.r].discard*(holo?3:1);}
function mult(a,t){return MATCH[a+">"+t]||1;}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3600);}
function dur(ms){const m=Math.max(0,Math.ceil(ms/60000));const h=Math.floor(m/60);return h?`${h} h ${String(m%60).padStart(2,"0")}`:`${m} min`;}
function todayUTC(){return new Date().toISOString().slice(0,10);}
function boostersNow(){
  if(!S.me) return 0;
  const b=S.me.boosters; if(b>=MAX_STOCK) return b;
  return Math.min(MAX_STOCK, b+Math.floor((Date.now()-new Date(S.me.last_refill).getTime())/REFILL_MS));
}
function nextBoosterMs(){
  if(!S.me||boostersNow()>=MAX_STOCK) return 0;
  const e=Date.now()-new Date(S.me.last_refill).getTime();
  return REFILL_MS-(e%REFILL_MS);
}
function errMsg(e){
  const m=e?.message||String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Connexion au serveur impossible. Vérifie ton réseau.";
  if(/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if(/User already registered/i.test(m)) return "Un compte existe déjà avec cet e-mail. Connecte-toi.";
  if(/Password should be at least/i.test(m)) return "Le mot de passe doit faire au moins 6 caractères.";
  if(/Email not confirmed/i.test(m)) return "Confirme ton e-mail avant de te connecter.";
  if(/rate limit/i.test(m)) return "Trop de tentatives, réessaie dans quelques minutes.";
  return m;
}
let busyAct=false;
async function act(fn, okMsg){
  if(busyAct) return null; busyAct=true; document.body.classList.add("working");
  try{
    const r=await fn(); if(r&&r.error) throw r.error;
    if(okMsg) toast(typeof okMsg==="function"?okMsg(r):okMsg);
    await sync(); render(); return r||true;
  }catch(e){ toast(errMsg(e)); try{await sync();render();}catch(_){} return null; }
  finally{ busyAct=false; document.body.classList.remove("working"); }
}

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Son (synthétisé, aucun fichier) ---------- */
const Sfx=(()=>{
  let ac=null, primed=false;
  // Le bouton silencieux de l'iPhone coupe les sons du jeu (comportement normal d'une appli de jeu)
  const ctx=()=>{if(L.mute)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){return null;}return ac;};
  const tone=(f,t,d,type="sine",g=.12)=>{const a=ctx();if(!a)return;const o=a.createOscillator(),v=a.createGain(),s=a.currentTime+t;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(g,s+.012);v.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(v).connect(a.destination);o.start(s);o.stop(s+d+.05);};
  const noise=(d,type,f0,f1,g=.2,t=0)=>{const a=ctx();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
    const src=a.createBufferSource(),fl=a.createBiquadFilter(),v=a.createGain(),s=a.currentTime+t;src.buffer=b;fl.type=type;fl.Q.value=1.2;fl.frequency.setValueAtTime(f0,s);fl.frequency.exponentialRampToValueAtTime(f1,s+d);
    v.gain.setValueAtTime(g,s);v.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(fl).connect(v).connect(a.destination);src.start(s);};
  return {
    // À appeler pendant un vrai toucher (touchend / click) : sur iPhone, le son ne peut démarrer qu'à ce moment-là
    unlock(){const a=ctx();if(!a)return;
      if(a.state!=="running") a.resume().catch(()=>{});
      if(!primed||a.state!=="running"){try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);primed=true;}catch(e){}}
      },
    // Micro (talkie-walkie) : l'iPhone doit passer en mode lecture + enregistrement, puis revenir
    session(rec){try{if(navigator.audioSession)navigator.audioSession.type=rec?"play-and-record":"auto";}catch(e){}},
    state(){return ac?ac.state:"pas encore créé";},
    // Son d'une carte (fichier importé dans l'admin) : chargé à l'avance, joué via le même contexte audio
    _clips:{},
    preload(url){if(!url||this._clips[url])return;const a=ctx();if(!a)return;
      this._clips[url]=fetch(url).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,ko)=>{const q=a.decodeAudioData(b,ok,ko);if(q&&q.catch)q.catch(()=>{});})).catch(()=>null);},
    _cur:null,
    async clip(url){if(!url)return;const a=ctx();if(!a)return;this.preload(url);const buf=await this._clips[url];
      try{this._cur&&this._cur.stop();}catch(e){}
      if(!buf){const el=new Audio(url);el.play().catch(()=>{});this._cur={stop(){el.pause();}};return;}
      const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.value=.95;s.connect(g).connect(a.destination);s.start();this._cur=s;},
    stopClip(){try{this._cur&&this._cur.stop();}catch(e){}this._cur=null;},
    scrape(){noise(.06,"bandpass",2500,3500,.05);},
    tear(){noise(.4,"bandpass",700,5000,.35);tone(180,0,.25,"triangle",.08);},
    whoosh(){noise(.28,"lowpass",4000,300,.18);},
    flip(){noise(.1,"highpass",1800,4000,.14);},
    rise(){noise(.5,"lowpass",300,1200,.12);},
    C(){tone(520,0,.12,"triangle",.07);},
    R(){tone(880,0,.25,"sine",.12);tone(1320,.08,.35,"sine",.1);},
    E(){[660,880,1100,1320].forEach((f,i)=>tone(f,i*.07,.4,"triangle",.1));},
    rumble(){tone(48,0,1.1,"sawtooth",.05);noise(1,"lowpass",120,600,.2);},
    L(){tone(65,0,.9,"sine",.25);[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.05+i*.075,.9,"triangle",.11));[1047,1319,1568].forEach(f=>tone(f,.55,1.4,"sine",.06));},
    holo(){[1568,1976,2349,2637,3136].forEach((f,i)=>tone(f,.15+i*.05,.3,"sine",.05));},
    pop(i){tone(500+i*90,0,.09,"triangle",.07);},
    clue(i){tone(98+i*24,0,.6,"sine",.28);noise(.35,"lowpass",2500,200,.14);tone(392+i*98,.02,.5,"triangle",.07);},
    drop(){noise(.32,"bandpass",400,3000,.16);},
    impact(){tone(52,0,.6,"sine",.35);noise(.3,"lowpass",900,80,.3);},
    crackle(){noise(.18,"highpass",3000,6000,.08);noise(.4,"lowpass",800,100,.06,.05);},
  };
})();
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ---------- Particules ---------- */
const makeFx=()=>{
  let cv,cx,list=[],raf=0,dpr=1,amb=0;
  const size=()=>{if(!cv)return;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);};
  const loop=()=>{
    cx.clearRect(0,0,innerWidth,innerHeight);
    list=list.filter(p=>p.life>0);
    for(const p of list){
      p.life-=1;p.vy+=p.g;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      const a=Math.min(1,p.life/p.fade);
      cx.globalAlpha=a;
      if(p.conf){cx.globalCompositeOperation="source-over";cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.s,-p.s*.45,p.s*2,p.s*.9);cx.restore();}
      else{cx.globalCompositeOperation="lighter";const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*3);g.addColorStop(0,p.c);g.addColorStop(1,"transparent");cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.s*3,0,7);cx.fill();}
    }
    cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
    raf=(list.length||amb)?requestAnimationFrame(loop):0;
  };
  const kick=()=>{if(!raf&&cx)raf=requestAnimationFrame(loop);};
  return {
    attach(c){cv=c;cx=c.getContext("2d");size();addEventListener("resize",size);},
    detach(){cancelAnimationFrame(raf);raf=0;list=[];clearInterval(amb);amb=0;removeEventListener("resize",size);cv=null;cx=null;},
    burst(x,y,colors,n,o={}){if(reduced)n=Math.ceil(n/4);for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,sp=(o.speed||6)*(.35+Math.random()*.9);
      list.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-(o.up||0),g:o.g??.12,drag:o.drag??.97,life:(o.life||70)*(.6+Math.random()*.6),fade:25,c:colors[i%colors.length],s:(o.size||2.4)*(.6+Math.random()*.8),rot:Math.random()*6,vr:(Math.random()-.5)*.4,conf:!!o.conf});}kick();},
    ambient(on){clearInterval(amb);amb=0;if(!on||reduced)return;amb=setInterval(()=>{list.push({x:Math.random()*innerWidth,y:innerHeight+10,vx:(Math.random()-.5)*.3,vy:-.6-Math.random()*.8,g:0,drag:1,life:260,fade:60,c:Math.random()<.5?"rgba(255,210,63,.7)":"rgba(180,140,255,.7)",s:1.2+Math.random()*1.5,rot:0,vr:0});kick();},140);kick();},
  };
};
const Fx=makeFx(), AFx=makeFx(); // AFx : particules de l'arène

/* ---------- La séquence d'ouverture ---------- */
const RCOL={C:["#cfc7e0","#8d84a3"],R:["#9fd0ff","#58a8ff","#ffffff"],E:["#e9b8ff","#cf7dff","#ffffff"],L:["#fff3b0","#ffd23f","#ffb13b","#ffffff"]};
const HOLOCOL=["#ff7ad1","#6ef0ff","#ffe86b","#a98bff","#7dffb0"];
const Opening={
  pulls:[],cur:0,els:[],busy:false,
  start(pulls){
    pulls.forEach(p=>p.c.audio&&Sfx.preload(p.c.audio));
    this.pulls=pulls;this.cur=0;this.els=[];this.busy=false;this.done=false;
    const ov=$("#opening");ov.className="ov";ov.hidden=false;
    ov.innerHTML=`<canvas aria-hidden="true"></canvas><div class="flash" id="ovflash"></div>

      <button class="btn small ghost" id="ovmute" aria-pressed="${!!L.mute}">${L.mute?"Son coupé":"Son activé"}</button></div>
      <div class="stage" id="stage"></div>`;
    Fx.attach(ov.querySelector("canvas"));Fx.ambient(true);
    $("#ovskip").onclick=()=>this.summary();
    $("#ovmute").onclick=e=>{L.mute=!L.mute;saveL();e.currentTarget.textContent=L.mute?"Son coupé":"Son activé";e.currentTarget.setAttribute("aria-pressed",L.mute);if(L.mute)document.querySelectorAll("#opening video").forEach(v=>v.muted=true);};

  showPack(){
    const st=$("#stage");
    st.innerHTML=`<div class="opack" id="opack" role="button" tabindex="0" aria-label="Déchirer le booster">
        <div class="light"></div>
        <div class="strip">◂ GLISSE ▸</div><div class="tear" id="tear"></div>
        <div class="body"><span class="pt">REF<br>POCKET</span><span class="ps">4 cartes</span><span class="serie">SÉRIE 1 · ${albumSize()} RÉFS</span></div>
      </div><p class="hint" id="hint">Glisse sur le haut du paquet pour le déchirer</p>`;
    $("#ovcount").textContent="";
    const pk=$("#opack");let x0=null,prog=0,last=0;
    const setP=p=>{prog=Math.max(0,Math.min(1,p));pk.style.setProperty("--tp",(prog*100)+"%");};
    pk.onpointerdown=e=>{Sfx.unlock();x0=e.clientX;last=0;pk.setPointerCapture(e.pointerId);};
    pk.onpointermove=e=>{if(x0===null||this.busy)return;const p=Math.abs(e.clientX-x0)/(pk.offsetWidth*.75);if(p-last>.08){Sfx.scrape();last=p;}setP(p);if(prog>=1){x0=null;this.tear();}};
    pk.onpointerup=pk.onpointercancel=e=>{if(x0===null)return;const moved=Math.abs(e.clientX-x0);x0=null;if(moved<12)this.autoTear(setP);else if(prog<1){pk.style.transition="";setP(0);}};
    pk.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();this.autoTear(setP);}};
  },
  tap(){
    if($("#opack")&&!this.busy) return this.autoTear(p=>$("#opack")?.style.setProperty("--tp",(p*100)+"%"));
    const sc=this.els[this.cur]; if(!sc||this.busy) return;
    sc.classList.contains("open")?this.next(1):this.reveal(sc);
  },
  autoTear(setP){
    if(this.busy)return;this.busy=true;Sfx.unlock();
    const t0=performance.now(),D=reduced?1:420;
    const step=t=>{const p=Math.min(1,(t-t0)/D);setP(p);if(p<1)requestAnimationFrame(step);else{this.busy=false;this.tear();}};

  },
  tear(){
    if(this.busy)return;this.busy=true;

    pk.style.setProperty("--lc","#fff1c9");pk.classList.add("torn");Sfx.tear();buzz(30);
    const r=pk.getBoundingClientRect();

  flash(gold){const f=$("#ovflash");f.className="flash"+(gold?" gold":"");void f.offsetWidth;f.classList.add("go");},
  buildStack(){

    st.innerHTML=`<div class="stack" id="stack"><div class="rays" id="rays"></div><div class="halo" id="halo"></div></div>

    this.els=this.pulls.map((p,i)=>{

      sc.innerHTML=`${p.isNew?'<span class="newtag">NOUVELLE</span>':""}<div class="flip">${cardBackHTML()}<div class="front">${cardHTML(p.c,{holo:p.holo,video:p.c.r==="L"})}</div></div>`;
      // Vidéo des légendaires : incrustée dans la carte, en pause jusqu'à la révélation

  wait(ms){return new Promise(res=>{const t0=performance.now();const tick=()=>{if(this.skip||this.done||performance.now()-t0>=ms)res();else setTimeout(tick,40);};tick();});},
  async walkout(sc,p){

      {lab:"Type",html:`<div class="sw" style="--cc:${TYPES[p.c.type].color}"></div><div class="big" style="--cc:${TYPES[p.c.type].color}">${esc(TYPES[p.c.type].name)}</div>`},

  bindDrag(sc){

      <div class="row">${boostersNow()>0?'<button class="btn foil" id="sumagain">Ouvrir le suivant</button>':(S.me.kheys>=BOOSTER_PRICE?`<button class="btn foil" id="sumbuy">Acheter un booster · ${BOOSTER_PRICE} K</button>`:"")}
      <button class="btn ghost" id="sumcol">Voir ma collection</button><button class="btn ghost" id="sumclose">Fermer</button></div></div>`;
    pulls.forEach((p,i)=>setTimeout(()=>Sfx.pop(i),i*80));

    $("#sumbuy")&&($("#sumbuy").onclick=()=>{this.close(false);openBooster(true);});

    $("#sumclose").onclick=()=>this.close();
    if(this.test){const row=$("#stage .sum .row");row.innerHTML=`<button class="btn foil" id="sumtest">Rejouer le test</button><button class="btn ghost" id="sumclose">Fermer</button>`;
      $("#sumtest").onclick=()=>Test.launch();$("#sumclose").onclick=()=>this.close();$("#stage .sum .sub").textContent="Mode test : rien n'a été ajouté à ta collection.";}
    ($("#sumagain")||$("#sumtest")||$("#sumclose")).focus();

let B=null; // partie en cours
function flags(u){return u.c.fx?FX[u.c.fx]:{};}
function mkUnit(c){const f=c.fx?FX[c.fx]:{};return {k:uid(),c,lvl:c.lvl||0,hp:c.v,max:c.v,p:c.p,d:c.d,hidden:!!f.hidden,reflect:!!f.reflect,shield:!!f.shield,cb:false,holo:!!c.holo,hu:false,stun:0,usedStun:false};}
function calc(a,t){let raw=Math.round(a.p*mult(a.c.type,t.c.type));if(flags(a).clash&&(t.c.r==="E"||t.c.r==="L"))raw+=flags(a).clash;return flags(a).pierce?Math.max(1,raw):Math.max(1,raw-t.d);}
// Holos du deck : L.holo[id] = true si on joue la version holo (il faut en posséder une)
function isHoloPick(id){return !!(L.holo&&L.holo[id])&&own(id).h>0;}
function deckPayload(){return L.deck.map(id=>isHoloPick(id)?id+"*":id);}
function deckCard(id){const c=myCard(id);return isHoloPick(id)?{...c,holo:true}:c;}
function deckValid(ids){
  if(ids.length!==DECK_SIZE) return false;
  if(new Set(ids).size!==ids.length) return false;
  if(ids.some(id=>count(id)<1)) return false;
  for(const r in DECK_MAX) if(ids.filter(id=>BYID[id].r===r).length>DECK_MAX[r]) return false;
  return true;
}
function autoDeck(){
  const mine=CARDS.filter(c=>count(c.id)>0).map(c=>myCard(c.id)).sort((a,b)=>(b.p+b.d+b.v)-(a.p+a.d+a.v));
  const deck=[];const used={L:0,E:0};
  for(const c of mine){ if(deck.length>=DECK_SIZE) break; if(DECK_MAX[c.r]!==undefined && used[c.r]>=DECK_MAX[c.r]) continue; deck.push(c.id); if(used[c.r]!==undefined) used[c.r]++; }
  return deck;
}
function startDuel(){
  if(!deckValid(L.deck)){toast("Ton deck doit contenir 6 cartes que tu possèdes.");return;}
  const mine=L.deck.map(id=>deckCard(id));
  const taken=new Set();
  const theirs=mine.map(c=>{const pool=BYR[c.r].filter(x=>!taken.has(x.id));const p=rnd(pool.length?pool:BYR[c.r]);taken.add(p.id);return Math.random()<.15?{...p,holo:true}:p;});
  theirs.sort(()=>Math.random()-.5); const mineS=[...mine].sort(()=>Math.random()-.5);
  const side=cs=>{const u=cs.map(mkUnit);return {active:u.slice(0,3),reserve:u.slice(3)};};
  const hm=()=>Math.round((.55+Math.random()*.45)*100)/100;
  B={sides:[side(mineS),side(theirs)],turn:Math.random()<.5?0:1,sel:null,log:[],over:null,bot:rnd(BOTS)+" (bot)",hit:null,busy:false,training:true,
     hype:[0,0],cused:[false,false],hm:[hm(),hm()],chocMode:false};
  log(B.turn===0?"Le sort a parlé : tu commences.":`${B.bot} commence.`);
  for(const si of [0,1]) for(const u of B.sides[si].active) enter(u,si);
  B.ev=[];
  render();
  beginTurn();
}
function beginTurn(){
  const g=B;
  if(!canAct(B.turn)){log(B.turn===0?"Toutes tes cartes sont étourdies : tu passes ton tour.":`${B.bot} passe son tour.`);render();setTimeout(()=>{if(B===g&&!B.over)endTurn(B.turn);},reduced?0:900);return;}
  render();
  if(B.turn===1) botTurn();
}
function log(m){B.log.unshift(m); B.log=B.log.slice(0,5);}
function nm(u,si){return `${si===0?"Ta carte":"Sa carte"} « ${u.c.name} »`;}
/* Moteur du duel d'entraînement : mêmes règles que le serveur (supabase/schema.sql, section 8).
   Chaque action ajoute des événements dans B.ev, rejoués ensuite par l'arène pour les animations. */
function ev(e){(B.ev=B.ev||[]).push(e);}
function fxev(si,i,t,sub){ev({k:"fx",s:si,i,t,sub});}
function unitAt(si,i){return B.sides[si].active[i];}
function dmgU(si,i,n,crit){
  const u=unitAt(si,i); if(!u||n<=0) return;
  if(u.shield){u.shield=false;log(`Fake news ! « ${u.c.name} » ne subit aucun dégât.`);fxev(si,i,"Fake news","Bloqué");return;}
  u.hp-=n; ev({k:"dmg",s:si,i,n,crit:!!crit}); hypeU(si,n);
  const f=flags(u);
  if(u.hp>0&&f.rage){u.p+=1;fxev(si,i,"Vénère","+1 PUN");}
  if(u.hp>0&&u.hp<=3&&f.remontada&&!u.cb){u.cb=true;u.hp=Math.min(u.max,u.hp+4);log(`Remontada ! « ${u.c.name} » récupère 4 de Viralité.`);ev({k:"heal",s:si,i,n:4});fxev(si,i,"Remontada","+4 VIR");}
}
function hypeU(si,n){if(!B.hype||B.cused[si])return;B.hype[si]=Math.min(100,B.hype[si]+Math.round(n*B.hm[si]));}
function healU(si,i,n){const u=unitAt(si,i);if(!u||n<=0)return;const g=Math.min(u.max,u.hp+n)-u.hp;if(g<=0)return;u.hp+=g;ev({k:"heal",s:si,i,n:g});}
function statU(si,i,k,n){const u=unitAt(si,i);if(u)u[k]=Math.max(0,u[k]+n);}
function enter(u,si){
  const f=flags(u), i=B.sides[si].active.indexOf(u), op=1-si;
  if(f.healEnter){fxev(si,i,FX[u.c.fx].name,`+${f.healEnter} VIR alliés`);for(let k=0;k<3;k++)healU(si,k,f.healEnter);log(`« ${u.c.name} » : son camp récupère ${f.healEnter} de Viralité.`);}
  if(f.debuffEnter){fxev(si,i,FX[u.c.fx].name,"−1 AUR adverses");for(let k=0;k<3;k++)statU(op,k,"d",-1);log(`« ${u.c.name} » : le camp adverse perd 1 en Aura.`);}
  if(f.stunAllEnter){fxev(si,i,"Fou rire","Tout le monde étourdi");for(let k=0;k<3;k++){const x=unitAt(op,k);if(x){x.stun=1;ev({k:"stun",s:op,i:k});}}log(`Fou rire ! « ${u.c.name} » étourdit tout le camp adverse.`);}
  if(f.hypeEnter){fxev(si,i,"Hype","+1 PUN alliés");for(let k=0;k<3;k++)if(k!==i)statU(si,k,"p",1);log(`Hype ! Les alliées de « ${u.c.name} » gagnent +1 en Punchline.`);}
  if(f.landing){const c=[0,1,2].filter(k=>unitAt(op,k)&&unitAt(op,k).hp>0);if(c.length){const k=rnd(c);fxev(si,i,"Débarquement","2 dégâts");log(`Débarquement ! « ${u.c.name} » inflige 2 dégâts à « ${unitAt(op,k).c.name} ».`);dmgU(op,k,f.landing);}}
}
function resolveDeaths(){
  let again=true,guard=0;
  while(again&&guard++<30){again=false;
    for(const si of [0,1]){const s=B.sides[si];
      for(let i=0;i<3;i++){const u=s.active[i];
        if(u&&u.hp<=0){
          log(`${nm(u,si)} est éliminée.`); ev({k:"ko",s:si,i});
          s.active[i]=null; hypeU(si,22);
          if(flags(u).lastword){fxev(si,i,"Dernier mot","2 dégâts à tous");log(`Dernier mot de « ${u.c.name} » : 2 dégâts à tout le camp adverse.`);for(let k=0;k<3;k++){const x=unitAt(1-si,k);if(x&&x.hp>0)dmgU(1-si,k,flags(u).lastword);}}
          s.active.forEach((a,k)=>{if(a&&flags(a).seum){a.p+=2;fxev(si,k,"Le seum","+2 PUN");log(`Le seum monte : « ${a.c.name} » gagne +2 en Punchline.`);}});
          const nx=s.reserve.shift();
          if(nx){s.active[i]=nx;log(`« ${nx.c.name} » entre sur le terrain.`);ev({k:"enter",s:si,i});enter(nx,si);}
          again=true;
        }}}
  }
  for(const si of [0,1]) if(B.sides[si].active.every(a=>!a)&&!B.sides[si].reserve.length){B.over=si===0?"lose":"win";}
}
function attack(si,ai,ti){
  const o=1-si,a=unitAt(si,ai),t=unitAt(o,ti);
  if(!a||!t||a.stun) return;
  B.ev=[]; a.hidden=false;
  const fa=flags(a), adv=mult(a.c.type,t.c.type)>1, holo=a.holo&&!a.hu;
  if(holo){a.hu=true;a.p+=3;}
  let dmg=calc(a,t), crit=false;
  if(holo) a.p-=3;
  if(fa.crit&&Math.random()<.25){dmg*=2;crit=true;}
  ev({k:"atk",s:si,a:ai,t:ti,adv});
  if(holo){fxev(si,ai,"Éclat holo","+3 dégâts");log(`Éclat holo de « ${a.c.name} » : +3 dégâts !`);}
  if(crit){fxev(si,ai,"Masterclass","Dégâts ×2");log(`Masterclass de « ${a.c.name} » : dégâts doublés !`);}
  if(fa.execute&&t.hp<=3){dmg=t.hp;fxev(si,ai,"Irrévocable","Exécution");log(`Sentence irrévocable : « ${t.c.name} » est exécutée.`);}
  if(t.reflect){
    t.reflect=false;fxev(o,ti,"Ratio","Renvoyé !");log(`Ratio ! « ${t.c.name} » renvoie ${dmg} dégât${dmg>1?"s":""} à « ${a.c.name} ».`);
    dmgU(si,ai,dmg);resolveDeaths();return;
  }
  const shielded=t.shield;
  log(`« ${a.c.name} » attaque « ${t.c.name} » : −${dmg}${adv?" (avantage de type)":""}.`);
  dmgU(o,ti,dmg,crit);
  const dealt=shielded?0:dmg, alive=unitAt(o,ti)&&unitAt(o,ti).hp>0;
  if(dealt>0){
    if(fa.lifesteal&&dealt>=2){const h=Math.floor(dealt/2);fxev(si,ai,"Gratte",`+${h} VIR`);healU(si,ai,h);}
    if(fa.malaise&&alive){statU(o,ti,"p",-1);fxev(o,ti,"Malaise","−1 PUN");}
    if(fa.expose&&alive){statU(o,ti,"d",-1);fxev(o,ti,"Exposé","−1 AUR");}
    if(fa.stunFirst&&!a.usedStun&&alive){t.stun=1;a.usedStun=true;ev({k:"stun",s:o,i:ti});fxev(si,ai,"Allô ?","Étourdie");log(`« ${t.c.name} » est étourdie et passera son tour.`);}
    if(fa.doubletap&&alive){fxev(si,ai,"Double tap","+1 dégât");dmgU(o,ti,1);}
  }
  if(flags(t).thorns){fxev(o,ti,"Piquant","1 dégât renvoyé");dmgU(si,ai,1);}
  if(fa.buzz&&a.hp>0){a.p+=1;fxev(si,ai,"Buzz","+1 PUN");}
  if(fa.splash){const c=[0,1,2].filter(k=>k!==ti&&unitAt(o,k)&&unitAt(o,k).hp>0);if(c.length){const k=rnd(c);fxev(si,ai,fa.splash>1?"Coucou général":"Éclaboussure",`${fa.splash} dégât${fa.splash>1?"s":""}`);log(`Éclaboussure : « ${unitAt(o,k).c.name} » perd ${fa.splash}.`);dmgU(o,k,fa.splash);}}
  resolveDeaths();
}
// Choc viral à l'entraînement : le bot « secoue » au hasard
async function localChoc(si,ai,ti){
  if(!B||B.over||B.anim) return; const g=B;
  B.anim=true;B.busy=true;B.sel=null;B.chocMode=false;
  B.cused[si]=true;B.hype[si]=0;render();
  const a=unitAt(si,ai),t=unitAt(1-si,ti);
  const bot=Math.round(25+Math.random()*60);
  const mine=await Choc.run({role:si===0?"atk":"def",mine:si===0?a:t,theirs:si===0?t:a,opp:B.bot});
  if(B!==g) return;
  const sa=si===0?mine:bot, sd=si===0?bot:mine;
  let win=sa>=15&&sa>sd, tie=false, pat=false;
  if(sa===sd&&sa>=15){
    tie=true; const pt=Array.from({length:4},()=>1+Math.floor(Math.random()*3));
    if(si===0) pat=await Choc.pattern(pt);
    else{Choc.waitPattern(pt,B.bot);await new Promise(r=>setTimeout(r,3500));pat=Math.random()<.5;}
    if(B!==g) return; win=pat;
  }
  B.ev=[];ev({k:"choc",s:si,a:ai,t:ti,sa,sd,win,tie,pat});
  if(win){const x=unitAt(1-si,ti);if(x){log(`Choc viral réussi : « ${x.c.name} » est pulvérisée !`);ev({k:"dmg",s:1-si,i:ti,n:Math.max(1,x.hp),crit:true});x.hp=0;}}
  else{log("Choc bloqué ! L'attaquante encaisse le contrecoup.");dmgU(si,ai,2);}
  resolveDeaths();
  await Arena.play(B.ev,(s,i)=>B.sides[s].active[i]);
  if(B!==g) return;
  B.anim=false;B.busy=false;B.ev=[];
  endTurn(si);
}
async function doAttack(si,ai,ti){
  if(!B||B.over||B.anim) return; const g=B;
  B.anim=true; B.busy=true; B.sel=null;
  attack(si,ai,ti);
  await Arena.play(B.ev,(s,i)=>B.sides[s].active[i]);
  if(B!==g) return;
  B.anim=false; B.busy=false; B.ev=[];
  endTurn(si);
}
function canAct(si){return B.sides[si].active.some(a=>a&&!a.stun);}
function endTurn(si){
  B.sides[si].active.forEach(a=>{if(a)a.stun=0;});
  B.sel=null;
  if(B.over){finishDuel();render();return;}
  B.turn=1-si;
  beginTurn();
}
function botTurn(){
  B.busy=true; const g=B;
  setTimeout(()=>{
    if(!B||B!==g||B.over) return;
    const me=B.sides[1],op=B.sides[0];let best=null,bs=-1e9;
    me.active.forEach((a,ai)=>{if(!a||a.stun)return;op.active.forEach((t,ti)=>{if(!t)return;
      let d=calc(a,t);if(flags(a).execute&&t.hp<=3)d=t.hp;
      let s=t.reflect?-d*2:Math.min(d,t.hp)+(d>=t.hp?6:0)+(t.c.r==="L"||t.c.r==="E"?1:0);
      s+=Math.random()*.5;if(s>bs){bs=s;best=[ai,ti];}});});
    B.busy=false;
    if(best&&B.hype[1]>=100&&!B.cused[1]&&Math.random()<.7){
      const ti=[0,1,2].filter(k=>op.active[k]).sort((x,y)=>(RORDER.indexOf(op.active[y].c.r)-RORDER.indexOf(op.active[x].c.r))||(op.active[y].hp-op.active[x].hp))[0];
      return localChoc(1,best[0],ti);
    }
    if(best) doAttack(1,best[0],best[1]); else endTurn(1);
  },reduced?100:950);
}

   BOOSTERS (le tirage se fait sur le serveur)
   ========================================================= */
async function openBooster(paid){
  if(busyAct) return; busyAct=true; document.body.classList.add("working");
  try{
    const r=await sb.rpc("open_booster",{p_paid:!!paid});
    if(r.error) throw r.error;
    // Une carte toute neuve (ajoutée pendant que l'appli était ouverte) : on recharge le catalogue pour ne pas la perdre à l'affichage
    if(r.data.some(x=>!BYID[x.card_id])) await loadCatalogue().catch(()=>{});
    const pulls=r.data.map(x=>({c:BYID[x.card_id],holo:x.holo,isNew:x.is_new})).filter(p=>p.c)
      .sort((a,b)=>RORDER.indexOf(a.c.r)-RORDER.indexOf(b.c.r)||a.holo-b.holo);
    await sync(); renderTop();
    Opening.test=false; Opening.start(pulls);
  }catch(e){ toast(errMsg(e)); }
  finally{ busyAct=false; document.body.classList.remove("working"); }
}

   DUEL : récompense validée par le serveur
   ========================================================= */
function finishDuel(){
  // Entraînement contre le bot : pas de récompense (seuls les duels en ligne rapportent des Kheys)
  if(B.rewarded) return; B.rewarded=true; B.gain=0;
  if(B.test){
    B.prize={mine:B.over==="win",test:true};
    if(B.over!=="win"){const g=B;setTimeout(()=>{if(B!==g)return;const pool=B.sides[0].active.concat(B.sides[0].reserve).filter(Boolean).map(u=>u.c);const deck=g.mydeck||pool;
      const c=Test.prizeDraw(deck.length?deck:CARDS.slice(0,6));B.prize.got=c.id;render();Sfx.C();},2500);}
  }
}

/* =========================================================

const Choc={
  key:null, el:null, perm:null,
  // iPhone : l'accès aux capteurs de mouvement doit être demandé après un toucher

      el.innerHTML=`<div class="ch-bg" aria-hidden="true"></div>

        <h2 class="ch-title">CHOC VIRAL !</h2>
        <div class="ch-cards">${this.card(o.mine,"me")}<div class="ch-bolt" aria-hidden="true">⚡</div>${this.card(o.theirs,"op")}</div>
        <p class="ch-role">${atk?`Secoue ton téléphone pour pulvériser « ${esc(o.theirs?.c.name||"")} » !`:`Secoue ton téléphone pour sauver « ${esc(o.mine?.c.name||"")} » !`}</p>
        <div class="ch-gauge"><i></i><b>0</b></div>
        <div class="ch-zone"><button class="btn foil ch-ready">JE SUIS PRÊT !</button><p class="note ch-hint">Tiens bien ton téléphone : 3 secondes de secousses à fond.</p></div>`;
      document.body.appendChild(el); document.documentElement.classList.add("chocking");
      Sfx.rumble(); buzz([200,80,200]);
      const gauge=el.querySelector(".ch-gauge i"), num=el.querySelector(".ch-gauge b"), zone=el.querySelector(".ch-zone");
      let done=false, started=false, measuring=false, energy=0, taps=0, gotMotion=false, prev=null, pt=0, score=0, lastBuzz=0;
      const onMotion=e=>{

      const cleanup=()=>{removeEventListener("devicemotion",onMotion);el.removeEventListener("pointerdown",onTap);removeEventListener("keydown",onTap);clearTimeout(auto);};
      const finish=v=>{if(done)return;done=true;measuring=false;cleanup();
        zone.innerHTML=`<p class="ch-wait">Score : <b>${v}</b><br><span class="note">En attente de ${esc(o.opp)}…</span></p>`;resolve(v);};
      const auto=setTimeout(()=>{if(!started)finish(0);},o.deadline?Math.max(4000,Math.min(18000,o.deadline-Date.now()-1000)):15000);

  patHTML(pat,done,cur){return `<div class="ch-pat">${pat.map((n,g)=>`<span class="grp${g<done?" ok":g===done?" now":""}">${Array.from({length:n},(_,k)=>`<i class="${g<done||(g===done&&k<cur)?"on":""}"></i>`).join("")}</span>`).join('<b class="sep">·</b>')}</div>`;},

      const coup=()=>{const now=performance.now();if(!active||now-last<REFR)return;

      const onMotion=e=>{const a=(e.acceleration&&e.acceleration.x!=null)?e.acceleration:e.accelerationIncludingGravity;if(!a||a.x==null)return;gotMotion=true;
        const v=[a.x||0,a.y||0,a.z||0];if(prev){const j=Math.hypot(v[0]-prev[0],v[1]-prev[1],v[2]-prev[2]);if(j>10)coup();}prev=v;};
      const onTap=e=>{if(!active||gotMotion)return;if(e.type==="keydown"&&e.code!=="Space")return;e.preventDefault();coup();};

/* ---------- Vidéo plein écran (légendaires) ---------- */
/* Vidéo d'une carte : une fois avec le son, puis en boucle sans le son.
   La vidéo reste en boucle dès le départ (pas d'arrêt/relance en fin de lecture, qui bloque sur certains téléphones)
   et repart toute seule si le téléphone la met en pause (son d'effet, économie d'énergie…). */
function playCardVideo(v,muted,alive){
  if(!v) return;
  v.loop=true; v.muted=!!muted; v.playsInline=true; v.setAttribute("webkit-playsinline","");
  try{v.currentTime=0;}catch(e){}
  let last=0;
  v.ontimeupdate=()=>{if(v.currentTime+.3<last) v.muted=true; last=v.currentTime;};
  const kick=()=>v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});
  v.onpause=()=>setTimeout(()=>{if(v.paused&&v.isConnected&&alive())kick();},250);
  kick();
}
function stopCardVideo(v){if(!v)return;v.onpause=null;v.ontimeupdate=null;try{v.pause();}catch(e){}}
const VideoFS={
  play(url,title){
    return new Promise(resolve=>{
      document.querySelector(".vfs")?.remove();
      const el=document.createElement("div"); el.className="vfs";
      el.innerHTML=`<video playsinline preload="auto" src="${esc(url)}"></video>
        <div class="vfs-top"><b>${esc(title||"")}</b><button class="vfs-x" aria-label="Fermer">✕</button></div>
        <button class="vfs-sound" hidden>🔊 Touche pour le son</button>`;
      document.body.appendChild(el);
      const v=el.querySelector("video"), snd=el.querySelector(".vfs-sound");
      const close=()=>{try{v.pause();}catch(e){} el.classList.add("out"); setTimeout(()=>{el.remove();resolve();},250);};
      el.querySelector(".vfs-x").onclick=e=>{e.stopPropagation();close();};
      snd.onclick=e=>{e.stopPropagation();v.muted=false;v.play().catch(()=>{});snd.hidden=true;};
      v.onended=close; v.onerror=close;
      v.play().catch(()=>{v.muted=true;snd.hidden=false;v.play().catch(close);});
    });
  }
};

/* ---------- Animations de l'arène : rejoue les événements d'un coup (B.ev en local, state.ev en ligne) ---------- */
const Arena={
  enters:[],
  root(){return $("#arena");},
  el(si,i){return document.querySelector(`#arena [data-unit="${si}-${i}"]`);},
  pos(el){const r=el.getBoundingClientRect(),a=this.root().getBoundingClientRect();return {x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2,sx:r.left+r.width/2,sy:r.top+r.height/2,w:r.width,h:r.height};},

  attachFx(){if(this._cv)return;const c=document.createElement("canvas");c.className="a-fx";c.setAttribute("aria-hidden","true");document.body.appendChild(c);AFx.attach(c);this._cv=c;},
  float(el,txt,cls){const root=this.root();if(!root||!el)return;const p=this.pos(el),d=document.createElement("div");d.className="a-num "+(cls||"");d.textContent=txt;d.style.left=p.x+"px";d.style.top=(p.y-p.h*.15)+"px";root.appendChild(d);setTimeout(()=>d.remove(),1200);},
  setHp(el,delta){if(!el||!el.dataset.max)return;const max=+el.dataset.max,hp=Math.max(0,Math.min(max,(+el.dataset.hp||0)+delta));el.dataset.hp=hp;
    const bar=el.querySelector(".u-hp i"),t=el.querySelector(".u-hp em");if(bar)bar.style.width=(hp/max*100)+"%";if(t&&t.textContent!=="?")t.textContent=hp;el.querySelector(".u-hp")?.classList.toggle("low",hp/max<=.34);},
