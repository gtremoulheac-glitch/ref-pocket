  async play(evs,unitOf){
    const root=this.root(); if(!root||!evs||!evs.length) return;
    this.attachFx(); this.enters=[];
    for(const e of evs){ try{ await this.step(e,unitOf); }catch(err){} }
  },
  async step(e,unitOf){
    const root=this.root(); if(!root) return;
    if(e.k==="atk"){
      const a=this.el(e.s,e.a), t=this.el(1-e.s,e.t); if(!a||!t) return;
      const pa=this.pos(a), pt=this.pos(t), dx=(pt.x-pa.x)*.62, dy=(pt.y-pa.y)*.62;
      a.classList.add("lunging"); Sfx.whoosh();
      if(!reduced) a.animate([{transform:"none"},{transform:`translate(${dx*.15}px,${dy*.15-10}px) scale(1.06)`,offset:.25},{transform:`translate(${dx}px,${dy}px) scale(1.14) rotate(${e.s?-7:7}deg)`,offset:.55},{transform:"none"}],{duration:560,easing:"cubic-bezier(.45,0,.25,1)"});
      await this.wait(300);
      const sl=document.createElement("div");sl.className="a-slash"+(e.adv?" adv":"");sl.style.left=pt.x+"px";sl.style.top=pt.y+"px";root.appendChild(sl);setTimeout(()=>sl.remove(),600);
      Sfx.impact(); this.restart(root,"quake"); buzz(25);
      if(e.adv) this.float(t,"Avantage !","adv");
      await this.wait(280); a.classList.remove("lunging");
    }
    else if(e.k==="dmg"){
      const t=this.el(e.s,e.i); if(!t) return;
      this.restart(t,"hurt"); this.setHp(t,-e.n);
      this.float(t,(e.crit?"CRITIQUE −":"−")+e.n,e.crit?"crit":"dmg");
      const p=this.pos(t); AFx.burst(p.sx,p.sy,e.crit?["#ffd23f","#ff6fbf","#ffffff"]:["#ff5d73","#ffb13b","#ffffff"],e.crit?70:34,{speed:e.crit?9:6,g:.12,life:55});
      if(e.crit){Sfx.E();buzz([30,30,60]);}
      await this.wait(e.crit?520:360);
    }
    else if(e.k==="heal"){
      const t=this.el(e.s,e.i); if(!t) return;
      this.restart(t,"healed"); this.setHp(t,e.n); this.float(t,"+"+e.n,"heal");
      const p=this.pos(t); AFx.burst(p.sx,p.sy,["#5be49b","#b8ffd6","#ffffff"],26,{speed:4,g:-.05,life:60,up:2});
      Sfx.pop(4); await this.wait(320);
    }
    else if(e.k==="fx"){
      const t=this.el(e.s,e.i), p=t?this.pos(t):{x:root.clientWidth/2,y:root.clientHeight/2,sx:innerWidth/2,sy:innerHeight/2,h:0};
      if(t) this.restart(t,"powered");
      const d=document.createElement("div");d.className="a-fxpop "+(e.s===0?"me":"op");d.innerHTML=`<b>${esc(e.t)}</b>${e.sub?`<small>${esc(e.sub)}</small>`:""}`;
      d.style.left=p.x+"px";d.style.top=(p.y-(p.h||0)*.55)+"px";root.appendChild(d);setTimeout(()=>d.remove(),1500);
      AFx.burst(p.sx,p.sy,["#ff6fbf","#a98bff","#46e0ff","#ffe46b"],40,{speed:7,g:.02,life:70});
      Sfx.holo(); await this.wait(820);
    }
    else if(e.k==="stun"){
      const t=this.el(e.s,e.i); if(!t) return;
      t.classList.add("stunned"); if(!t.querySelector(".u-stun")) t.insertAdjacentHTML("beforeend",'<span class="u-stun">💫</span>');
      Sfx.pop(1); await this.wait(260);
    }
    else if(e.k==="ko"){
      const t=this.el(e.s,e.i); if(!t) return;
      const p=this.pos(t); t.classList.add("ko");
      AFx.burst(p.sx,p.sy,["#8d84a3","#cfc7e0","#ff5d73","#3d2a77"],60,{speed:8,g:.2,life:70,conf:true,size:3});
      Sfx.drop(); buzz(40); await this.wait(620);
    }
    else if(e.k==="choc"){ await Choc.result(e); }
    else if(e.k==="enter"){
      const old=this.el(e.s,e.i)||document.querySelector(`#arena [data-slot="${e.s}-${e.i}"]`);
      const u=unitOf&&unitOf(e.s,e.i);
      if(old&&u){old.outerHTML=unitHTML(u,e.s,e.i,true);const n=this.el(e.s,e.i);if(n){this.restart(n,"entering");}}
      this.enters.push([e.s,e.i]); Sfx.drop(); await this.wait(560);
    }
  },
  // Après chaque affichage de l'arène : bannière de tour, intro, célébration de fin
  after(){
    const root=this.root(); if(!root||!B) return;
    root.querySelectorAll("[data-prize]").forEach(b=>{b.onclick=e=>{e.stopPropagation();pickPrize(b);};});
    this.attachFx();
    if(!B.introDone){B.introDone=true;scrollTo(0,0);setTimeout(()=>root.classList.remove("intro"),1200);this.banner("DUEL !",`contre ${B.bot}`,"go");Sfx.rumble();return;}
    if(B.over){if(!B.celebrated){B.celebrated=true;
        if(B.over==="win"){Sfx.L();buzz([60,40,120]);for(let k=0;k<6;k++)setTimeout(()=>AFx.burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.2+Math.random()*.3),["#ffd23f","#ff6fbf","#46e0ff","#5be49b","#ffffff"],60,{speed:8,g:.15,conf:true,size:4,life:120,up:3}),k*220);}
        else Sfx.C();}
      return;}
    if(B.shownTurn!==B.turn){B.shownTurn=B.turn;
      if(B.turn===0){this.banner("À toi !","","me");Sfx.R();buzz(20);} else this.banner(`Tour de ${B.bot.replace(/\s*\(bot\)/,"")}`,"","op");}
  },
  banner(t,sub,cls){const b=$("#abanner");if(!b)return;b.className="a-banner "+cls;b.innerHTML=`<b>${esc(t)}</b>${sub?`<small>${esc(sub)}</small>`:""}`;void b.offsetWidth;b.classList.add("show");}
};

/* =========================================================
   AMIS ET DUELS EN LIGNE
   ========================================================= */
const ONLINE_MS = 2*60*1000, CLAIM_MS = 95*1000;
function isOnline(p){return !!p&&!!p.last_seen&&Date.now()-new Date(p.last_seen).getTime()<ONLINE_MS;}
function pseudoOf(id){return S.players[id]?.pseudo||"Joueur";}
function onlineCount(){return Object.values(S.players).filter(p=>p.id!==S.me.id&&isOnline(p)).length;}
function friendRows(){
  const me=S.me.id;
  return S.friends.map(f=>({...f,other:f.requester===me?f.addressee:f.requester,mine:f.requester===me}));
}
function friendsList(){return friendRows().filter(f=>f.status==="accepted").map(f=>S.players[f.other]).filter(Boolean)
  .sort((a,b)=>(isOnline(b)-isOnline(a))||a.pseudo.localeCompare(b.pseudo));}
function incomingFriendReqs(){return friendRows().filter(f=>f.status==="pending"&&!f.mine);}
// Duels en cours de mes amis (on peut les regarder)
function liveOf(uid){return (S.live||[]).find(d=>d.a===uid||d.b===uid)||null;}
async function loadLive(){if(!S.me)return;const r=await sb.rpc("live_duels");S.live=r.error?[]:(r.data||[]);}
function incomingInvites(){return S.duels.filter(d=>d.status==="invited"&&d.player_b===S.me.id&&Date.now()-new Date(d.created_at).getTime()<10*60*1000);}

// Transforme une ligne "duels" du serveur en partie affichable (même forme que le duel local)
function toB(r,prev){
  const watch=!!Online.watch&&Online.id===r.id;
  const me=watch?0:(r.player_a===S.me.id?0:1), st=r.state;
  const conv=u=>u?{c:BYID[u.c]||{id:u.c,name:u.name,type:u.type,r:u.r,art:u.art||"❔",image:u.img||null,fx:u.fx&&FX[u.fx]?u.fx:null,p:u.p,d:u.d,v:u.max,fl:""},
    lvl:u.lvl||0,shield:!!u.shield,holo:!!u.holo,hu:!!u.hu,hp:u.hp,max:u.max,p:u.p,d:u.d,hidden:!!u.hidden,reflect:!!u.reflect,stun:u.stun||0}:null;
  const side=s=>({active:st.sides[s].active.map(conv),reserve:st.sides[s].reserve.map(conv)});
  const same=prev&&prev.online&&prev.id===r.id;
  const moved=same&&prev.move!==r.move_no;
  const hy=st.hype||[0,0], cu=st.cused||[false,false];
  return {online:true,id:r.id,move:r.move_no,sides:[side(me),side(1-me)],
    hype:[hy[me]||0,hy[1-me]||0],cused:[!!cu[me],!!cu[1-me]],chocMode:same&&!moved?prev.chocMode:false,
    choc:st.choc?{...st.choc,by:st.choc.by===me?0:1,mine:st.choc.sc?st.choc.sc[me]:null}:null,
    prize:st.prize?{mine:st.prize.w===me,got:st.prize.got||null,pick:st.prize.pick,others:st.prize.others||[],stolen:st.prize.stolen!==false}:null,turn:st.turn===me?0:1,
    sel:same&&!moved?prev.sel:null,log:st.log||[],bot:pseudoOf(me===0?r.player_b:r.player_a),
    over:r.status==="finished"?((watch?r.winner===r.player_a:r.winner===S.me.id)?"win":"lose"):null,
    watch,meName:watch?pseudoOf(r.player_a):S.me.pseudo,gain:me===0?r.gain_a:r.gain_b,busy:false,
    hit:null,turnStarted:r.turn_started_at,
    introDone:same?prev.introDone:false,shownTurn:same?prev.shownTurn:undefined,celebrated:same?prev.celebrated:false};
}
const Online={
  id:null,row:null,timer:null,pending:false,notified:false,
  track(id){if(this.id===id&&!this.watch)return;this.stop();this.watch=false;this.id=id;this.row=null;this.played=0;this.notified=false;this.timer=setInterval(()=>this.poll(),1500);this.poll();},
  stop(){clearInterval(this.timer);this.timer=null;},
  clear(){this.stop();this.id=null;this.row=null;this.watch=false;if(B&&B.online)B=null;},
  // Regarder le duel d'un ami (spectateur)
  watchDuel(id){if(Online.row&&Online.row.status==="active"&&!this.watch){toast("Termine d'abord ton duel.");return;}
    this.stop();this.watch=true;this.id=id;this.row=null;this.played=0;this.notified=false;B=null;tab="duel";
    this.timer=setInterval(()=>this.poll(),1500);this.poll();render();scrollTo(0,0);},
  async poll(){
    if(!this.id||this.pending) return; this.pending=true;
    const id=this.id,watch=this.watch;
    try{const r=await sb.rpc(watch?"duel_watch":"duel_poll",{p_duel:id});
      if(r.error){if(watch&&this.id===id){toast("Ce duel est terminé.");this.clear();render();}throw r.error;}
      if(this.id!==id||this.watch!==watch) return;
      await this.set(r.data);
      if(r.data&&["active","finished"].includes(r.data.status)) Voice.check(id);}
    catch(e){} finally{this.pending=false;}
  },
  async set(row){
    const prev=this.row;
    // Un nouveau coup : on rejoue ses animations sur l'arène affichée avant de passer au nouvel état
    const evs=row.state&&Array.isArray(row.state.ev)?row.state.ev:[];
    if(prev&&row.id===prev.id&&row.move_no<prev.move_no) return; // réponse en retard : on garde l'état le plus récent
    if(prev&&row.id===prev.id&&row.move_no>prev.move_no&&row.move_no>(this.played||0)&&evs.length&&B&&B.online&&B.id===row.id&&tab==="duel"&&Arena.root()&&!$("#dlg").open){
      this.played=row.move_no;
      const me=this.watch?0:(row.player_a===S.me.id?0:1), loc=x=>x===me?0:1;
      const nb=toB(row,B);
      B.anim=true;
      await Arena.play(evs.map(e=>({...e,s:loc(e.s)})),(s,i)=>nb.sides[s].active[i]);
      if(B) B.anim=false;
    }
    this.row=row;
    const pz=row.state&&row.state.prize, waitPrize=row.status==="finished"&&pz&&!pz.got;
    if(["finished","cancelled"].includes(row.status)&&!waitPrize) this.stop();
    if(!this.watch&&prev&&prev.status==="finished"&&pz&&pz.got&&!(prev.state.prize&&prev.state.prize.got)){
      const me=row.player_a===S.me.id?0:1;
      if(pz.w!==me){const c=BYID[pz.got];toast(`${pseudoOf(me===0?row.player_b:row.player_a)} t'a pris « ${c?c.name:"une carte"} »…`);buzz(200);sync().then(renderTop).catch(()=>{});}
    }
    const changed=!prev||prev.status!==row.status||prev.move_no!==row.move_no||JSON.stringify(prev.state&&prev.state.prize)!==JSON.stringify(row.state&&row.state.prize);
    if(row.status==="active"||row.status==="finished"){
      const before=B; B=toB(row,B&&B.online?B:null);
      if(!this.watch&&changed&&row.status==="active"&&B.turn===0&&tab!=="duel"&&(!before||before.turn!==0)) toast(`À toi de jouer contre ${B.bot} !`);
      if(!this.watch&&prev&&prev.status!=="active"&&row.status==="active"&&tab!=="duel") toast(`Duel lancé contre ${B.bot} ! Va dans l'onglet Duel.`);
      if(this.watch&&row.status==="finished"&&!this.notified){this.notified=true;Sfx.E();}
      if(!this.watch&&row.status==="finished"&&!this.notified){this.notified=true;
        if(prev&&prev.status==="active") (B.over==="win"?(Sfx.L(),buzz([60,40,120])):Sfx.C());
        sync().then(renderTop).catch(()=>{});}
    }
    if(row.status==="cancelled"){
      if(prev&&prev.status==="invited"&&row.player_a===S.me.id) toast(`${pseudoOf(row.player_b)} n'a pas accepté le défi.`);
      this.clear();
    }
    if(changed){ if(tab==="duel"&&!$("#dlg").open) render(); else renderTop(); }
    if(row.status==="active"&&!this.watch) this.chocCheck(row);
    else if(tab==="duel") tickTurn();
  },
  async run(fn,ok){
    const r=await act(fn,ok); if(r&&r.data!=null&&typeof r.data==="number") this.track(r.data);
    return r;
  },
  async choc(a,t){
    if(!B||!B.online||B.busy) return; B.busy=true; B.sel=null; B.chocMode=false; render();
    this.pending=true;
    try{
      const r=await sb.rpc("duel_choc",{p_duel:B.id,p_a:a,p_t:t});
      if(r.error){toast(errMsg(r.error));if(B)B.busy=false;render();return;}
      await this.set(r.data);
    }finally{this.pending=false;}
  },
  // Un choc est en attente : chacun ouvre la confrontation et envoie son score
  chocCheck(row){
    const c=row.state&&row.state.choc; if(!c||!B||!B.online) return;
    if(tab!=="duel"){if(Choc.warned!==row.id+":"+c.at){Choc.warned=row.id+":"+c.at;toast("CHOC VIRAL ! Va vite dans l'onglet Duel pour secouer ton téléphone !");buzz([100,50,100]);}return;}
    const me=row.player_a===S.me.id?0:1, mine=c.sc?c.sc[me]:null, key=row.id+":"+c.at;
    if(c.phase==="pattern"){
      const pk=row.id+":pat:"+c.pat_at; if(Choc.patKey===pk) return; Choc.patKey=pk;
      if(c.by!==me){Choc.waitPattern(c.pat,B.bot);return;}
      Choc.pattern(c.pat).then(async ok=>{
        while(this.pending) await new Promise(r=>setTimeout(r,100));
        this.pending=true;
        try{const r=await sb.rpc("duel_choc_pattern",{p_duel:row.id,p_ok:ok});if(!r.error&&r.data) await this.set(r.data);}
        finally{this.pending=false;}
      });
      return;
    }
    if(mine!=null||Choc.key===key) return;
    Choc.key=key;
    const st=row.state, ua=st.sides[c.by].active[c.a], ut=st.sides[1-c.by].active[c.t];
    const conv=u=>u?{c:BYID[u.c]||{name:u.name,type:u.type,r:u.r,art:u.art,image:u.img},hp:u.hp,max:u.max}:null;
    const atk=c.by===me;
    Choc.run({role:atk?"atk":"def",mine:conv(atk?ua:ut),theirs:conv(atk?ut:ua),opp:B.bot}).then(async score=>{
      while(this.pending) await new Promise(r=>setTimeout(r,100));
      this.pending=true;
      try{const r=await sb.rpc("duel_choc_score",{p_duel:row.id,p_score:score});if(!r.error&&r.data) await this.set(r.data);}
      finally{this.pending=false;}
    });
  },
  async play(a,t){
    if(!B||!B.online||B.busy) return; B.busy=true; B.sel=null; render();
    this.pending=true;
    try{
      const r=await sb.rpc("duel_play",{p_duel:B.id,p_a:a,p_t:t});
      if(r.error){toast(errMsg(r.error));if(B)B.busy=false;render();return;}
      await this.set(r.data);
    }finally{this.pending=false;}
  },
};
function tickTurn(){
  const el=$("#turntimer"); if(!el||!B||!B.online||B.over) return;
  const e=Date.now()-new Date(B.turnStarted).getTime(), left=Math.max(0,Math.ceil((90000-e)/1000));
  el.textContent=left>0?`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`:"temps écoulé";
  const cl=$("#claimbtn"); if(cl) cl.hidden=!(B.turn===1&&e>CLAIM_MS);
}

function friendState(id){const f=friendRows().find(x=>x.other===id);return !f?{s:"none"}:f.status==="accepted"?{s:"friend",f}:f.mine?{s:"sent",f}:{s:"received",f};}

  };

    const any=freeN+freeH>0;
    dlg.innerHTML=`<form method="dialog" class="dlg cardview" id="cardform">
      <div class="cardbig">${cardHTML(c,{holo:holo||(!freeN&&o.h>0)})}</div>

let NT=null;
function openNewTrade(to){NT={step:to?2:1,to:to||null,preset:!!to,give:new Set(),kg:0};drawNewTrade();if(!$("#dlg").open)$("#dlg").showModal();}

function instGrid(list,sel,attr){
  if(!list.length) return `<div class="empty-state">Aucune carte disponible.</div>`;
  const sorted=[...list].sort((a,b)=>RORDER.indexOf(BYID[b.card_id]?.r)-RORDER.indexOf(BYID[a.card_id]?.r)||(BYID[a.card_id]?.n-BYID[b.card_id]?.n));
  return `<div class="pickgrid">${sorted.filter(i=>BYID[i.card_id]).map(i=>`<button type="button" ${attr}="${i.id}" aria-pressed="${sel.has(i.id)}" class="${sel.has(i.id)?"picked":""}">${cardHTML(BYID[i.card_id],{holo:i.holo})}</button>`).join("")}</div>`;
}
async function drawNewTrade(){
  const dlg=$("#dlg");
  const others=friendsList();
  const who=NT.to?esc(S.players[NT.to]?.pseudo||"Joueur"):"";
  const counter=NT.mode==="counter";
  let body="";
  if(NT.step===1) body=`<p class="eyebrow">Étape 1 sur 2</p><h2>Avec qui ?</h2>
    <div class="players">${others.map(p=>`<button type="button" class="player" data-nt-to="${p.id}"><b>${esc(p.pseudo)}</b><span class="note">${isOnline(p)?"En ligne":"Hors ligne"}</span></button>`).join("")||'<div class="empty-state">Aucun autre joueur pour l\'instant.</div>'}</div>`;
  if(NT.step===2){
    const free=S.insts.filter(i=>!i.lock);
    const theirs=counter?NT.trade.items.filter(i=>i.side==="give"&&i.inst):[];
    body=counter
      ?`<p class="eyebrow">Ta réponse à ${who}</p><h2>${who} te propose</h2>
        <div class="tcards">${theirs.map(i=>BYID[i.inst.card_id]?`<div>${cardHTML(BYID[i.inst.card_id],{holo:i.inst.holo})}</div>`:"").join("")}${NT.trade.kheys_give?`<div class="tk">+${fmt(NT.trade.kheys_give)} K</div>`:""}</div>
        <h2 style="margin-top:6px">Ce que tu donnes en retour</h2><p class="note">${NT.give.size} carte${NT.give.size>1?"s":""} choisie${NT.give.size>1?"s":""} (10 max). ${who} pourra ensuite accepter ou refuser.</p>`
      :`<p class="eyebrow">${NT.preset?"Échange avec "+who:"Étape 2 sur 2"}</p><h2>Ce que tu proposes à ${who}</h2>
        <p class="note">${NT.give.size} carte${NT.give.size>1?"s":""} choisie${NT.give.size>1?"s":""} (10 max). ${who} ne voit pas ta collection, seulement ces cartes. Il te proposera les siennes en retour, et tu décideras.</p>`;
    body+=`${instGrid(free,NT.give,"data-nt-give")}
      <div class="field"><label for="nt-kg">Ajouter des Kheys (tu en as ${fmt(S.me.kheys)})</label><input type="number" id="nt-kg" min="0" max="${S.me.kheys}" step="1" value="${NT.kg}"></div>`;
  }
  const ok=counter?(NT.give.size>0||NT.kg>0):NT.give.size>0;
  const back=NT.step>1&&!NT.preset&&!counter;
  dlg.innerHTML=`<div class="dlg">${body}
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn ghost" data-nt="${back?"back":"close"}">${back?"Retour":"Annuler"}</button>
      ${NT.step===2?`<button type="button" class="btn foil" data-nt="send" ${ok?"":"disabled"}>${counter?`Envoyer ma réponse`:`Envoyer l'offre à ${who}`}</button>`:""}
    </div></div>`;
  const kg=dlg.querySelector("#nt-kg"); if(kg) kg.oninput=()=>{NT.kg=Math.max(0,parseInt(kg.value,10)||0);const b=dlg.querySelector('[data-nt="send"]');if(b&&counter)b.disabled=!(NT.give.size>0||NT.kg>0);};
}
$("#dlg").addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t||!NT) return;
  if(t.dataset.ntTo){NT.to=t.dataset.ntTo;NT.step=2;return drawNewTrade();}
  const toggle=(set,id)=>{id=Number(id);if(set.has(id))set.delete(id);else{if(set.size>=10){toast("10 cartes maximum.");return;}set.add(id);}drawNewTrade();};
  if(t.dataset.ntGive) return toggle(NT.give,t.dataset.ntGive);
  const a=t.dataset.nt;
  if(a==="close"){NT=null;$("#dlg").close();}
  if(a==="back"){NT.step--;drawNewTrade();}
  if(a==="send"){
    if(NT.kg>S.me.kheys){toast("Tu n'as pas assez de Kheys.");return;}
    const n=NT, who=S.players[n.to]?.pseudo||"ce joueur";
    const r=n.mode==="counter"
      ?await act(()=>sb.rpc("counter_trade",{p_trade:n.trade.id,p_give:[...n.give],p_kheys:n.kg}),`Réponse envoyée à ${who}`)
      :await act(()=>sb.rpc("propose_trade",{p_to:n.to,p_give:[...n.give],p_take:[],p_kheys_give:n.kg,p_kheys_take:0}),`Offre envoyée à ${who}`);
    if(r){NT=null;$("#dlg").close();tab="trades";render();}
  }
});

/* =========================================================
   MODE TEST (admins) : index.html?test=… ouvert depuis la page admin.
   Rien n'est envoyé au serveur : pas de booster consommé, pas de carte gagnée ni perdue.
   ========================================================= */
const Test={
  q:new URLSearchParams(location.search),
  get kind(){return this.q.get("test");},
  on(){return !!this.kind&&!!S.me?.is_admin;},
  card(k="card"){const id=this.q.get(k);return id&&BYID[id]||null;},
  num(k,d){const v=parseInt(this.q.get(k),10);return isNaN(v)?d:v;},
  names:{booster:"Ouverture de booster",card:"Carte en grand",video:"Vidéo de la carte",duel:"Duel contre le bot",choc:"Choc viral",pattern:"Rythme du choc",prize:"Butin de fin de duel"},
  init(){
    if(!this.kind) return;
    if(!S.me?.is_admin){toast("Le mode test est réservé aux admins.");return;}
    if(!document.querySelector(".testpill")){
      const b=document.createElement("div");b.className="testpill";
      b.title="Mode test : "+(this.names[this.kind]||this.kind);
      b.innerHTML=`<span aria-hidden="true">🧪</span><button type="button" data-t="again" aria-label="Relancer le test">↻</button><button type="button" data-t="quit" aria-label="Quitter le mode test">✕</button>`;
      b.onclick=e=>{const t=e.target.closest("[data-t]");if(!t)return;if(t.dataset.t==="again")this.launch();else location.href=location.pathname;};
      document.body.appendChild(b);
    }
    this.launch();
  },
  reset(){
    if(!$("#opening").hidden) Opening.close(false);
    Choc.close(); document.querySelector(".vfs")?.remove();
    const d=$("#dlg"); if(d.open) d.close();
    B=null; prizeBusy=false;
  },
  launch(){
    Sfx.unlock(); this.reset();
    const k=this.kind;
    try{
      if(k==="booster") return this.booster();
      if(k==="card") return this.cardView();
      if(k==="video") return this.cardView();
      if(k==="duel") return this.duel();
      if(k==="prize") return this.duel(this.q.get("res")||"win");
      if(k==="choc") return this.choc();
      if(k==="pattern") return this.pattern();
      toast("Test inconnu : "+k);
    }catch(e){console.error(e);toast("Test impossible : "+e.message);}
  },
  pickR(r,not){const pool=(BYR[r]||[]).filter(c=>!not||!not.has(c.id));return pool.length?rnd(pool):rnd(BYR[r]||CARDS);},
  booster(){
    const best=this.card()||this.pickR(this.q.get("r")||"L");
    const used=new Set([best.id]);
    const low=best.r==="C"?["C","C","C"]:["C","C","R"];
    const pulls=low.map(r=>{const c=this.pickR(r,used);used.add(c.id);return {c,holo:false,isNew:Math.random()<.5};});
    pulls.push({c:best,holo:this.q.get("holo")==="1",isNew:this.q.get("new")!=="0"});
    pulls.sort((a,b)=>RORDER.indexOf(a.c.r)-RORDER.indexOf(b.c.r)||a.holo-b.holo);
    Opening.test=true; Opening.start(pulls);
  },
  cardView(){
    const c=this.card()||this.pickR(this.q.get("r")||"L");
    openCard(c.id,{holo:this.q.get("holo")==="1",lvl:this.num("lvl",0)});
  },
  video(){
    const c=this.card(); if(!c||!c.video){toast("Cette carte n'a pas de vidéo.");return;}
    VideoFS.play(c.video,c.name);
  },
  deck(first,lvl,holo){
    const slots=["L","E","R","R","C","C"],ids=new Set(),out=[];
    const add=(c,h)=>{ids.add(c.id);out.push({...boosted(c,lvl),holo:!!h});};
    if(first){add(first,holo);const k=slots.indexOf(first.r);slots.splice(k>=0?k:slots.length-1,1);}
    for(const r of slots) add(this.pickR(r,ids),false);
    return out.sort(()=>Math.random()-.5);
  },
  duel(end){
    const lvl=this.num("lvl",0);
    const mine=this.deck(this.card(),lvl,this.q.get("holo")==="1"), theirs=this.deck(this.card("opp"),0,false);
    const side=cs=>{const u=cs.map(mkUnit);return {active:u.slice(0,3),reserve:u.slice(3)};};
    const h=this.q.get("hype")||"";
    B={sides:[side(mine),side(theirs)],turn:this.q.get("first")==="bot"?1:0,sel:null,log:[],over:null,bot:"Bot de test",hit:null,busy:false,training:true,test:true,
       hype:[h.includes("me")?100:0,h.includes("bot")?100:0],cused:[false,false],hm:[1,1],chocMode:false,theirs,mydeck:mine};
    log("Mode test");
    for(const si of [0,1]) for(const u of B.sides[si].active) enter(u,si);
    B.ev=[]; tab="duel";
    if(end){B.introDone=true;B.over=end==="lose"?"lose":"win";finishDuel();render();return;}
    render(); beginTurn();
  },
  // Butin simulé avec les mêmes chances que le serveur (L 1, E 6, R 30, C 60)
  prizeDraw(pool){const w={L:1,E:6,R:30,C:60};let best=null,bk=Infinity;for(const c of pool){const k=-Math.log(1-Math.random())/w[c.r];if(k<bk){bk=k;best=c;}}return best;},
  unit(c){return mkUnit({...c});},
  async choc(){
    const atk=this.q.get("role")!=="def";
    const mine=this.unit(this.card()||this.pickR("E")), theirs=this.unit(this.card("opp")||this.pickR("R"));
    const sc=await Choc.run({role:atk?"atk":"def",mine,theirs,opp:"Bot de test"});
    const forced=this.q.get("bot"), tieWanted=this.q.get("tie")==="1";
    let bot=tieWanted?sc:forced!=null&&forced!==""?Math.max(0,Math.min(100,+forced)):Math.round(25+Math.random()*60);
    const sa=atk?sc:bot, sd=atk?bot:sc;
    let win=sa>=15&&sa>sd, tie=false, pat=false;
    if(sa===sd&&sa>=15){
      tie=true; const pt=Array.from({length:4},()=>1+Math.floor(Math.random()*3));
      if(atk) pat=await Choc.pattern(pt); else{Choc.waitPattern(pt,"Bot de test");await new Promise(r=>setTimeout(r,3500));pat=Math.random()<.5;}
      win=pat;
    }
    await Choc.result({s:atk?0:1,sa,sd,win,tie,pat});
    toast(`Test terminé : toi ${sc}, bot ${bot}${tie?" (égalité)":""}`);
  },
  async pattern(){
    const n=Math.max(2,Math.min(6,this.num("n",4)));
    const pt=Array.from({length:n},()=>1+Math.floor(Math.random()*3));
    const ok=await Choc.pattern(pt); Choc.close();
    toast(ok?"Rythme réussi !":"Rythme raté.");
  },
};

  if(a==="leave"){B=null;return render();}
  if(a==="wleave"){Online.clear();B=null;loadLive().then(render);return render();}
  if(a==="testagain") return Test.launch();
  if(t.dataset.prize!==undefined) return pickPrize(t);
  if(a==="chocmode"){if(!B||B.watch||B.over||B.busy||B.turn!==0)return;B.chocMode=!B.chocMode;Choc.prepare();return render();}
  if(a==="forfeit"){if(!B||B.over)return;
    if(B.online){if(!confirmTap(t,"Confirmer l'abandon"))return;return act(()=>sb.rpc("duel_forfeit",{p_duel:B.id})).then(()=>Online.poll());}
    B.over="lose";log("Tu as abandonné.");finishDuel();return render();}
  if(a==="dleave"){Online.clear();B=null;return act(async()=>{});}
  if(a==="dclaim") return act(()=>sb.rpc("duel_claim",{p_duel:B.id})).then(()=>Online.poll());
  if(a==="dfind") return Online.run(()=>sb.rpc("duel_find",{p_deck:deckPayload()}));
  if(a==="dfriend") return openFriendPicker();
  if(a==="dcancel"){const id=Online.id;Online.clear();return act(()=>sb.rpc("duel_cancel",{p_duel:id}));}
  if(t.dataset.daccept){const id=+t.dataset.daccept;return act(()=>sb.rpc("duel_accept",{p_duel:id,p_deck:deckPayload()})).then(r=>{if(r)Online.track(id);});}
  if(t.dataset.ddecline) return act(()=>sb.rpc("duel_cancel",{p_duel:+t.dataset.ddecline}),"Défi refusé");
  if(t.dataset.challenge){if(!deckValid(L.deck)){tab="duel";render();toast("Compose d'abord ton deck de 6 cartes.");return;}
    tab="duel";return Online.run(()=>sb.rpc("duel_challenge",{p_friend:t.dataset.challenge,p_deck:deckPayload()}),`Défi envoyé à ${pseudoOf(t.dataset.challenge)}`);}
  if(t.dataset.tradewith) return openNewTrade(t.dataset.tradewith);
  if(t.dataset.profile) return openProfile(t.dataset.profile);
  if(t.dataset.addfriend){const v=t.dataset.addfriend;return act(()=>sb.rpc("friend_request",{p_pseudo:v}),r=>r.data==="accepted"?`${v} et toi êtes maintenant amis !`:`Demande envoyée à ${v}`);}
  if(t.dataset.watch) return Online.watchDuel(+t.dataset.watch);
  if(t.dataset.counter) return openCounter(+t.dataset.counter);
  if(t.dataset.faccept) return act(()=>sb.rpc("friend_respond",{p_id:+t.dataset.faccept,p_accept:true}),"Vous êtes maintenant amis !");
  if(t.dataset.frefuse) return act(()=>sb.rpc("friend_respond",{p_id:+t.dataset.frefuse,p_accept:false}),"Demande refusée");
  if(t.dataset.unfriend){if(!confirmTap(t,t.classList.contains("linkbtn")?"confirmer":"Retirer ?"))return;return act(()=>sb.rpc("friend_remove",{p_other:t.dataset.unfriend}),"C'est fait");}
  if(t.dataset.filter){colFilter=t.dataset.filter;return render();}
  if(t.dataset.colmode){colMode=t.dataset.colmode;return render();}
  if(t.dataset.claim){const a=albumList().find(x=>x.key===t.dataset.claim);Sfx.unlock&&Sfx.unlock();
    return act(()=>sb.rpc("claim_album",{p_type:t.dataset.claim}),r=>`Album « ${a?a.name:""} » complété : +${fmt(r.data)} K !`);}
  if(t.dataset.card) return openCard(t.dataset.card);
  if(t.dataset.sellcard) return openSell(t.dataset.sellcard);
  if(t.dataset.mkt){mktTab=t.dataset.mkt;return render();}
  if(t.dataset.buyl){if(!confirmTap(t,`Confirmer ${fmt(+t.dataset.price)} K`))return;
    const l=S.listings.find(x=>x.id==t.dataset.buyl);const c=l&&BYID[l.inst.card_id];
    return act(()=>sb.rpc("buy_listing",{p_listing:+t.dataset.buyl}),`« ${c?c.name:"Carte"} » ajoutée à ta collection`);}
  if(t.dataset.cancel) return act(()=>sb.rpc("cancel_listing",{p_listing:+t.dataset.cancel}),"Annonce retirée, la carte revient dans ta collection");
  if(t.dataset.accept){if(!confirmTap(t,"Confirmer l'échange"))return;
    return act(()=>sb.rpc("respond_trade",{p_trade:+t.dataset.accept,p_accept:true}),r=>r.data==="accepted"?"Échange réussi !":"Échange impossible : une des cartes n'est plus disponible.");}
  if(t.dataset.refuse){if(!confirmTap(t,"Confirmer"))return;return act(()=>sb.rpc("respond_trade",{p_trade:+t.dataset.refuse,p_accept:false}),"C'est fait, les cartes sont libérées");}
  if(t.dataset.tcancel) return act(()=>sb.rpc("cancel_trade",{p_trade:+t.dataset.tcancel}),"Offre annulée, tes cartes sont libérées");
  if(t.dataset.pick){const id=t.dataset.pick,holo=t.dataset.holo==="1";L.holo=L.holo||{};
    if(L.deck.includes(id)&&isHoloPick(id)!==holo){L.holo[id]=holo;saveL();return render();}
    if(!L.deck.includes(id)) L.holo[id]=holo;
    if(L.deck.includes(id))L.deck=L.deck.filter(x=>x!==id);else{if(L.deck.length>=DECK_SIZE)return;const r=BYID[id].r;if(DECK_MAX[r]!==undefined&&L.deck.filter(x=>BYID[x].r===r).length>=DECK_MAX[r]){toast(`Maximum ${DECK_MAX[r]} ${RARITIES[r].name.toLowerCase()}${DECK_MAX[r]>1?"s":""} par deck.`);return;}L.deck.push(id);}saveL();return render();}
  if(t.dataset.unpick){L.deck=L.deck.filter(x=>x!==t.dataset.unpick);saveL();return render();}
  if(t.dataset.unit&&B&&!B.watch&&!B.over&&B.turn===0&&!B.busy&&!B.choc){
    const [si,i]=t.dataset.unit.split("-").map(Number);
    if(si===0){const u=B.sides[0].active[i];if(!u)return;if(u.stun){toast("Cette carte est étourdie ce tour-ci.");return;}B.sel=B.sel===i?null:i;return render();}
    if(si===1&&B.sel!==null){
      if(B.chocMode) return B.online?Online.choc(B.sel,i):localChoc(0,B.sel,i);
      return B.online?Online.play(B.sel,i):doAttack(0,B.sel,i);}
  }
});

/* =========================================================
   TALKIE-WALKIE pendant les duels en ligne : on maintient le bouton 🎙️ pour parler (6 s max),
   le message part à l'adversaire (et aux amis qui regardent) et se joue tout seul chez eux.
   ========================================================= */
const Voice={rec:null,last:null,duel:null,busy:false,
  ok(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&!!(window.AudioContext||window.webkitAudioContext);},
  async start(btn){
    if(this.rec||this.busy||!B||!B.online||B.watch) return;
    if(!this.ok()){toast("Le micro n'est pas disponible sur cet appareil.");return;}
    Sfx.unlock(); Sfx.stopClip(); Sfx.session(true); this.busy=true; this.released=false;
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
    catch(e){this.busy=false;Sfx.session(false);toast("Autorise le micro pour utiliser le talkie-walkie.");return;}
    const ac=new (window.AudioContext||window.webkitAudioContext)(); try{await ac.resume();}catch(e){}
    const src=ac.createMediaStreamSource(stream), proc=ac.createScriptProcessor(4096,1,1), chunks=[];
    proc.onaudioprocess=e=>{chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));};
    src.connect(proc); proc.connect(ac.destination);
    this.rec={stream,ac,src,proc,chunks,t0:performance.now(),duel:B.id};
    this.busy=false;
    document.querySelectorAll("[data-talk]").forEach(b=>b.classList.add("rec"));
    this.bubble("🎙️ Tu parles… relâche pour envoyer",true);
    buzz(25);
    this.rec.auto=setTimeout(()=>this.stop(),6000);
    if(this.released) this.stop();   // bouton relâché pendant la demande d'accès au micro
  },
  async stop(){
    if(this.busy){this.released=true;return;}
    const r=this.rec; if(!r) return; this.rec=null; clearTimeout(r.auto);
    document.querySelectorAll("[data-talk]").forEach(b=>b.classList.remove("rec"));
    try{r.proc.disconnect();r.src.disconnect();}catch(e){}
    r.stream.getTracks().forEach(t=>t.stop());
    const rate=r.ac.sampleRate; try{r.ac.close();}catch(e){} Sfx.session(false);
    const dur=(performance.now()-r.t0)/1000;
    if(dur<.5){this.bubble("Maintiens le bouton pour parler");return;}
    this.bubble("📡 Envoi…",true);
    try{
      const wav=this.wav(r.chunks,rate,12000);
      const path=`${S.me.id}/${r.duel}-${Date.now()}.wav`;
      const up=await sb.storage.from("voix").upload(path,wav,{contentType:"audio/wav",upsert:false});
      if(up.error) throw up.error;
      const url=sb.storage.from("voix").getPublicUrl(path).data.publicUrl;
      const x=await sb.rpc("duel_voice_send",{p_duel:r.duel,p_url:url,p_dur:Math.min(6,dur)});
      if(x.error) throw x.error;
      if(this.duel===r.duel) this.last=Math.max(this.last||0,x.data);
      this.bubble("✅ Message envoyé");
    }catch(e){this.bubble("");toast("Message non envoyé : "+errMsg(e));}
  },
  // Son mono 16 bits, rééchantillonné pour rester léger (environ 24 Ko par seconde)
  wav(chunks,inRate,outRate){
    const n=chunks.reduce((s,c)=>s+c.length,0), all=new Float32Array(n); let o=0; for(const c of chunks){all.set(c,o);o+=c.length;}
    const ratio=inRate/outRate, len=Math.floor(n/ratio), pcm=new Int16Array(len);
    let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(all[i]));
    const gain=peak>0.02?Math.min(4,0.9/peak):1;   // remonte un peu le volume des voix faibles
    for(let i=0;i<len;i++){const a=Math.floor(i*ratio),b=Math.min(n,Math.floor((i+1)*ratio));let s=0;for(let k=a;k<b;k++)s+=all[k];const v=Math.max(-1,Math.min(1,(s/Math.max(1,b-a))*gain));pcm[i]=v<0?v*0x8000:v*0x7fff;}
    const buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf), w=(p,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(p+i,s.charCodeAt(i));};
    w(0,"RIFF");dv.setUint32(4,36+pcm.length*2,true);w(8,"WAVE");w(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
    dv.setUint32(24,outRate,true);dv.setUint32(28,outRate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,pcm.length*2,true);
    new Int16Array(buf,44).set(pcm);
    return new Blob([buf],{type:"audio/wav"});
  },
  // Réception : appelée à chaque rafraîchissement du duel
  async check(duelId){
    if(!duelId||this.checking) return; this.checking=true;
    try{
      if(this.duel!==duelId){this.duel=duelId;this.last=null;}
      if(this.last==null){
        const r=await sb.from("duel_voice").select("id").eq("duel_id",duelId).order("id",{ascending:false}).limit(1);
        if(r.error) return; this.last=r.data.length?r.data[0].id:0; return;
      }
      const r=await sb.from("duel_voice").select("id,sender,url,dur").eq("duel_id",duelId).gt("id",this.last).order("id",{ascending:true}).limit(10);
      if(r.error||!r.data.length) return;
      for(const m of r.data){this.last=Math.max(this.last,m.id); if(m.sender!==S.me.id) this.play(m);}
    }finally{this.checking=false;}
  },
  play(m){
    if(this.rec) return;
    Sfx.clip(m.url);
    this.bubble(`🔊 ${pseudoOf(m.sender)} parle…`,false,(m.dur||2)*1000+600);
    buzz(30);
  },
  bubble(t,stay,ms){
    let el=document.querySelector(".vbubble");
    if(!t){el?.remove();return;}
    if(!el){el=document.createElement("div");el.className="vbubble";el.setAttribute("role","status");document.body.appendChild(el);}
    el.textContent=t; clearTimeout(this.bt);
    if(!stay) this.bt=setTimeout(()=>el.remove(),ms||1800);
  },
};
document.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-talk]");if(!b)return;e.preventDefault();Voice.start(b);});
for(const ev of ["pointerup","pointercancel"]) document.addEventListener(ev,()=>{if(Voice.rec||Voice.busy)Voice.stop();});

/* =========================================================
   INCLINAISON : les cartes bougent un peu quand on penche le téléphone
   (collection et carte en grand). Sur iPhone, l'autorisation est demandée au premier toucher.
   ========================================================= */
const Tilt={on:false,asked:false,x:0,y:0,base:null,raf:0,
  // L'iPhone redemande l'accès aux mouvements à chaque lancement : on ne le demande qu'une seule fois au total.
  // Ensuite on écoute sans rien demander (si l'accès est encore valable, ça marche) ; on peut le réactiver dans les réglages.
  async ask(force){
    if((this.asked&&!force)||reduced||!("DeviceOrientationEvent" in window)) return; this.asked=true;
    const needs=typeof DeviceOrientationEvent.requestPermission==="function";
    if(!needs){this.start();return;}
    if(!force&&L.tiltAsked){this.start();return;}
    L.tiltAsked=true; saveL();
    try{ if((await DeviceOrientationEvent.requestPermission())!=="granted") return; }catch(e){ return; }
    this.start();
  },
  start(){
    if(this.on) return; this.on=true;
    addEventListener("deviceorientation",e=>{
      if(e.beta==null||e.gamma==null) return;
      if(!this.base) this.base={b:e.beta,g:e.gamma};
      // La position « au repos » suit doucement la façon dont on tient le téléphone
      this.base.b+=(e.beta-this.base.b)*.02; this.base.g+=(e.gamma-this.base.g)*.02;
      const cl=v=>Math.max(-1,Math.min(1,v));
      this.x=cl((e.gamma-this.base.g)/20); this.y=cl((e.beta-this.base.b)/20);
      if(!this.raf) this.raf=requestAnimationFrame(()=>{this.raf=0;this.apply();});
    });
  },
  apply(){
    const cv=document.querySelector("#dlg[open] #cvcard");
    if(cv){cv.style.transform=`rotateY(${this.x*16}deg) rotateX(${-this.y*16}deg)`;cv.style.setProperty("--sx",`${50+this.x*50}%`);cv.style.setProperty("--sy",`${50+this.y*50}%`);
      cv.closest(".cv-stage")?.classList.add("tilting");}
  },
};
addEventListener("pointerdown",()=>{if(document.querySelector("#dlg[open] #cvcard"))Tilt.ask();},{passive:true});

/* =========================================================
   INSTALLER L'APPLI : proposé quand le jeu est ouvert dans le navigateur
   ========================================================= */
const Install={evt:null,
  standalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;},
  ios(){const u=navigator.userAgent;return /iphone|ipad|ipod/i.test(u)||(/macintosh/i.test(u)&&navigator.maxTouchPoints>1);},
  iosSafari(){const u=navigator.userAgent;return this.ios()&&/safari/i.test(u)&&!/crios|fxios|edgios|instagram|fban|fbav|snapchat|tiktok/i.test(u);},
  init(){
    if(this.standalone()) return;
    addEventListener("beforeinstallprompt",e=>{e.preventDefault();this.evt=e;this.show();});
    addEventListener("appinstalled",()=>{this.hide();toast("Ref Pocket est installée sur ton téléphone !");});
    if(this.ios()) setTimeout(()=>this.show(),2500);
  },
  hide(){document.querySelector(".instbar")?.remove();},
  show(){
    if(this.standalone()||document.querySelector(".instbar")||Date.now()-(L.instNo||0)<3*864e5) return;
    if(!this.evt&&!this.ios()) return;
    const b=document.createElement("div");b.className="instbar";b.setAttribute("role","dialog");b.setAttribute("aria-label","Installer l'appli");
    const txt=this.evt?"Joue en plein écran, comme une vraie appli."
      :this.iosSafari()?"Touche <b>Partager</b> <svg class=\"shr\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v12M7 8l5-5 5 5\"/><path d=\"M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7\"/></svg> en bas de Safari, puis « <b>Sur l'écran d'accueil</b> »."
      :"Ouvre ce lien dans <b>Safari</b>, puis Partager → « Sur l'écran d'accueil ».";
    b.innerHTML=`<span class="ib-ic" aria-hidden="true">RP</span><span class="ib-t"><b>Installe Ref Pocket</b><span>${txt}</span></span>
      ${this.evt?'<button type="button" class="btn small foil" data-ib="go">Installer</button>':""}<button type="button" class="ib-x" data-ib="no" aria-label="Plus tard">✕</button>`;
    b.onclick=async e=>{const a=e.target.closest("[data-ib]")?.dataset.ib;if(!a)return;
      if(a==="no"){L.instNo=Date.now();saveL();return this.hide();}
      if(a==="go"&&this.evt){this.evt.prompt();const r=await this.evt.userChoice.catch(()=>null);this.evt=null;this.hide();if(r&&r.outcome!=="accepted"){L.instNo=Date.now();saveL();}}};
    document.body.appendChild(b);
  },
};
Install.init();
